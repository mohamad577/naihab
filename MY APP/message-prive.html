<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Discussion</title>
    <style>
        :root { --bg-deep: #1a0b5a; --gold: #ffcc00; --glass: rgba(255,255,255,0.05); }
        body { margin: 0; background-color: var(--bg-deep); color: white; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .header { display: flex; align-items: center; padding: 15px 20px; background: rgba(13,18,74,0.95); border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); z-index: 100; }
        .back-btn { text-decoration: none; font-size: 24px; color: var(--gold); margin-right: 15px; cursor: pointer; }
        .contact-info { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; }
        .status-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 20px; font-size: 14px; line-height: 1.4; animation: apparaitre 0.3s ease; word-break: break-word; }
        @keyframes apparaitre { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .envoye { align-self: flex-end; background: var(--gold); color: #1a0b5a; font-weight: 600; border-bottom-right-radius: 5px; }
        .recu { align-self: flex-start; background: rgba(255,255,255,0.08); color: white; border-bottom-left-radius: 5px; border: 1px solid rgba(255,255,255,0.1); }
        .msg-status { font-size: 10px; text-align: right; margin-top: 4px; opacity: 0.7; }
        .msg-img { max-width: 100%; border-radius: 12px; display: block; margin-top: 5px; }
        .msg-heure { font-size: 10px; opacity: 0.4; text-align: center; margin: 5px 0; }

        /* Réactions emoji sur les messages */
        .msg-wrapper { display: flex; flex-direction: column; }
        .msg-wrapper.envoye { align-items: flex-end; }
        .msg-wrapper.recu { align-items: flex-start; }
        .reactions { font-size: 16px; margin-top: 2px; cursor: pointer; }

        .input-area { padding: 12px 15px; background: #0d124a; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .input-bar { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; padding: 12px 20px; color: white; outline: none; font-size: 14px; }
        .input-bar:focus { border-color: var(--gold); }
        .send-btn { background: var(--gold); border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 20px; transition: 0.2s; }
        .send-btn:active { transform: scale(0.9); }
        .photo-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 20px; transition: 0.2s; }
        .photo-btn:active { background: rgba(255,204,0,0.2); }

        /* AJOUT : barre d'emojis rapides */
        .emoji-bar { display: none; padding: 10px 15px; background: #0d124a; border-top: 1px solid rgba(255,255,255,0.05); gap: 10px; overflow-x: auto; }
        .emoji-bar.visible { display: flex; }
        .emoji-opt { font-size: 24px; cursor: pointer; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="header">
        <span onclick="window.history.back()" class="back-btn">⇠</span>
        <div class="contact-info" onclick="allerAuProfil()">
            <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100" class="avatar" id="chat-avatar" alt="Contact">
            <div>
                <b id="chat-username">Utilisateur</b>
                <div style="font-size:11px; opacity:0.6;"><span class="status-dot"></span> En ligne</div>
            </div>
        </div>
        <span style="font-size:20px; opacity:0.7; cursor:pointer;" onclick="ouvrirMenuChat()">⋮</span>
    </div>

    <!-- Menu trois points -->
    <div id="menu-chat" onclick="fermerMenuChat()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000;">
        <div onclick="event.stopPropagation()" style="position:absolute; bottom:0; width:100%; background:#0d124a; border-radius:25px 25px 0 0; padding:20px; box-sizing:border-box;">
            <div style="width:40px; height:5px; background:rgba(255,255,255,0.2); border-radius:10px; margin:0 auto 20px auto;"></div>
            <div onclick="effacerConversation()" style="padding:15px; font-weight:bold; border-bottom:1px solid rgba(255,255,255,0.05); cursor:pointer;">🗑️ Effacer la conversation</div>
            <div onclick="couperNotifs()" style="padding:15px; font-weight:bold; border-bottom:1px solid rgba(255,255,255,0.05); cursor:pointer;">🔕 Couper les notifications</div>
            <div onclick="signalerContact()" style="padding:15px; font-weight:bold; color:#ff4757; cursor:pointer;">🚨 Signaler</div>
            <button onclick="fermerMenuChat()" style="width:100%; margin-top:15px; padding:15px; border-radius:15px; border:none; background:rgba(255,255,255,0.1); color:white; font-weight:bold; cursor:pointer;">Annuler</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <!-- AJOUT : barre d'emojis rapides -->
    <div class="emoji-bar" id="emoji-bar">
        <span class="emoji-opt" onclick="insererEmoji('😂')">😂</span>
        <span class="emoji-opt" onclick="insererEmoji('❤️')">❤️</span>
        <span class="emoji-opt" onclick="insererEmoji('👑')">👑</span>
        <span class="emoji-opt" onclick="insererEmoji('🔥')">🔥</span>
        <span class="emoji-opt" onclick="insererEmoji('😍')">😍</span>
        <span class="emoji-opt" onclick="insererEmoji('🙏')">🙏</span>
        <span class="emoji-opt" onclick="insererEmoji('💯')">💯</span>
        <span class="emoji-opt" onclick="insererEmoji('👏')">👏</span>
        <span class="emoji-opt" onclick="insererEmoji('😭')">😭</span>
        <span class="emoji-opt" onclick="insererEmoji('✨')">✨</span>
    </div>

    <div class="input-area">
        <input type="file" id="input-photo" accept="image/*" style="display:none" onchange="envoyerPhoto(event)">
        <div class="photo-btn" onclick="document.getElementById('input-photo').click()">📷</div>
        <input type="text" id="monMessage" class="input-bar" placeholder="Écrire..."
               onkeydown="verifierEntree(event)"
               onfocus="document.getElementById('emoji-bar').classList.add('visible')"
               onblur="setTimeout(() => document.getElementById('emoji-bar').classList.remove('visible'), 200)">
        <button class="send-btn" onclick="envoyer()">➤</button>
    </div>

<script>
    let nomActuel = "";
    let photoActuelle = "";
    let cleConversation = "";

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        nomActuel = urlParams.get('name') || localStorage.getItem('naihab_contact_actif') || "Utilisateur";
        photoActuelle = urlParams.get('img') || localStorage.getItem('naihab_contact_avatar') || '';

        cleConversation = "naihab_chat_" + nomActuel.toLowerCase().replace(/\s/g, '_');

        document.getElementById('chat-username').innerText = nomActuel;
        document.getElementById('monMessage').placeholder = "Écrire à " + nomActuel + "...";
        if (photoActuelle) document.getElementById('chat-avatar').src = photoActuelle;

        chargerMessages();
    };

    function obtenirHeure() {
        const d = new Date();
        return d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    }

    function chargerMessages() {
        const zone = document.getElementById('chatBox');
        const messagesSauvegardes = JSON.parse(localStorage.getItem(cleConversation)) || [];
        
        if (messagesSauvegardes.length === 0) {
            const bienvenue = document.createElement('div');
            bienvenue.className = "msg recu";
            bienvenue.innerHTML = `Salut ! Bienvenue sur Naïhab 👑<div class="msg-status">✓</div>`;
            zone.appendChild(bienvenue);
        } else {
            messagesSauvegardes.forEach(msg => afficherMessage(msg, false));
        }
        zone.scrollTop = zone.scrollHeight;
    }

    function afficherMessage(msg, sauvegarder = true) {
        const zone = document.getElementById('chatBox');
        const wrapper = document.createElement('div');
        wrapper.className = "msg-wrapper " + msg.type;

        const div = document.createElement('div');
        div.className = "msg " + msg.type;

        // CORRECTION : sécurité — on échappe le texte pour éviter l'injection HTML
        if (msg.typeContenu === 'image') {
            div.innerHTML = `<img src="${msg.contenu}" class="msg-img" alt="Photo">
                             <div class="msg-status">${msg.heure || ''} ${msg.type === 'envoye' ? '✓✓' : ''}</div>`;
        } else {
            const texteSecurise = msg.contenu.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            div.innerHTML = `${texteSecurise}
                             <div class="msg-status">${msg.heure || ''} ${msg.type === 'envoye' ? '✓✓' : ''}</div>`;
        }

        wrapper.appendChild(div);
        zone.appendChild(wrapper);
        zone.scrollTo({ top: zone.scrollHeight, behavior: 'smooth' });

        if (sauvegarder) {
            const messagesSauvegardes = JSON.parse(localStorage.getItem(cleConversation)) || [];
            messagesSauvegardes.push(msg);
            localStorage.setItem(cleConversation, JSON.stringify(messagesSauvegardes));
            mettreAJourListeConversations(msg);
        }
    }

    // CORRECTION : faire apparaître/mettre à jour cette discussion dans la liste
    // de discussions.html à chaque message, et la faire remonter en haut (comme
    // sur les grandes applications de messagerie)
    function mettreAJourListeConversations(msg) {
        let conversations = JSON.parse(localStorage.getItem('naihab_conversations')) || [];
        const apercu = msg.typeContenu === 'image' ? '📷 Photo' : msg.contenu;
        conversations = conversations.filter(c => c.nom.toLowerCase() !== nomActuel.toLowerCase());
        conversations.unshift({
            nom: nomActuel,
            avatar: photoActuelle,
            dernierMsg: apercu,
            heure: msg.heure,
            nonLu: false
        });
        localStorage.setItem('naihab_conversations', JSON.stringify(conversations));
    }

    function envoyer() {
        const champ = document.getElementById('monMessage');
        const texte = champ.value.trim();
        if (texte !== "") {
            afficherMessage({ type: 'envoye', typeContenu: 'texte', contenu: texte, heure: obtenirHeure() });
            champ.value = "";
            // AJOUT : simulation d'une réponse après 1.5 secondes
            setTimeout(() => simulerReponse(), 1500);
        }
    }

    // AJOUT : réponses automatiques simulées (pour démo)
    function simulerReponse() {
        const reponses = [
            "Super ! 😊", "Ah oui vraiment ? 👑", "Je te réponds dès que possible !",
            "Ok je vois 🔥", "Haha 😂", "C'est vrai ça !", "Tu as raison ✨"
        ];
        const texte = reponses[Math.floor(Math.random() * reponses.length)];
        afficherMessage({ type: 'recu', typeContenu: 'texte', contenu: texte, heure: obtenirHeure() });
    }

    function envoyerPhoto(event) {
        const fichier = event.target.files[0];
        if (fichier) {
            const reader = new FileReader();
            reader.onload = function(e) {
                afficherMessage({ type: 'envoye', typeContenu: 'image', contenu: e.target.result, heure: obtenirHeure() });
            };
            reader.readAsDataURL(fichier);
        }
    }

    // CORRECTION : keydown au lieu de keypress (keypress est déprécié)
    function verifierEntree(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            envoyer();
        }
    }

    function insererEmoji(emoji) {
        const champ = document.getElementById('monMessage');
        champ.value += emoji;
        champ.focus();
    }

    function ouvrirMenuChat() { document.getElementById('menu-chat').style.display = 'block'; }
    function fermerMenuChat() { document.getElementById('menu-chat').style.display = 'none'; }

    function effacerConversation() {
        if (confirm("Effacer toute la conversation ?")) {
            localStorage.removeItem(cleConversation);
            document.getElementById('chatBox').innerHTML = '';
            fermerMenuChat();
            chargerMessages();
            // On retire aussi la conversation de la liste dans discussions.html
            let conversations = JSON.parse(localStorage.getItem('naihab_conversations')) || [];
            conversations = conversations.filter(c => c.nom.toLowerCase() !== nomActuel.toLowerCase());
            localStorage.setItem('naihab_conversations', JSON.stringify(conversations));
        }
    }

    function couperNotifs() { alert("Notifications coupées pour " + nomActuel); fermerMenuChat(); }
    function signalerContact() { alert("Merci pour ton signalement. Nous allons examiner ce compte."); fermerMenuChat(); }

    function allerAuProfil() {
        const nom = document.getElementById('chat-username').innerText;
        const photo = document.getElementById('chat-avatar').src;
        window.location.href = `profil-public.html?name=${encodeURIComponent(nom)}&img=${encodeURIComponent(photo)}`;
    }
</script>

</body>
</html>
