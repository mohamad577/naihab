<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Sécurité</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a0b5a; /* Bleu nuit Naïhab */
            color: white;
            text-align: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container { width: 100%; max-width: 350px; }

        h1 { 
            font-size: 28px; 
            font-weight: 900; 
            margin-bottom: 10px;
            color: #ffcc00; /* Jaune Naïhab */
        }

        p { 
            opacity: 0.7; 
            font-size: 14px; 
            margin-bottom: 40px; 
            line-height: 1.5;
        }

        .input-group { text-align: left; margin-bottom: 25px; width: 100%; }

        label { 
            display: block; 
            margin-bottom: 10px; 
            font-weight: bold; 
            font-size: 12px; 
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #ffcc00; }

        /* Barre de sécurité améliorée */
        .strength-container {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .strength-bar {
            height: 6px;
            width: 70%;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .strength-fill { height: 100%; width: 0%; background: #ff5252; transition: 0.4s; }

        .strength-text {
            font-size: 11px;
            font-weight: bold;
            color: #00ff88;
        }

        .btn-finish {
            width: 100%;
            padding: 18px;
            background: #ffcc00;
            color: #1a0b5a;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-finish:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dernière étape</h1>
        <p>Crée ton secret pour verrouiller l'accès à ton univers Naïhab.</p>
        
        <div class="input-group">
            <label>Nouveau mot de passe</label>
            <input type="password" id="mdp1" placeholder="Minimum 8 caractères" oninput="verifierForce(this.value)">
            <div class="strength-container">
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <span class="strength-text" id="strength-text">EN ATTENTE</span>
            </div>
        </div>

        <div class="input-group" style="margin-top: 10px;">
            <label>Confirmer le secret</label>
            <input type="password" id="mdp2" placeholder="Répète ton mot de passe">
        </div>

        <button class="btn-finish" onclick="finaliser()">FINALISER MON COMPTE</button>
    </div>

<script>
    function verifierForce(mdp) {
        const fill = document.getElementById('strength-fill');
        const text = document.getElementById('strength-text');
        let score = 0;
        if (mdp.length >= 8) score++;
        if (/[A-Z]/.test(mdp)) score++;
        if (/[0-9]/.test(mdp)) score++;
        if (/[^A-Za-z0-9]/.test(mdp)) score++;

        const niveaux = [
            { w: '0%',   color: '#ff5252', label: 'EN ATTENTE' },
            { w: '25%',  color: '#ff5252', label: 'FAIBLE ❌' },
            { w: '50%',  color: '#ffcc00', label: 'MOYEN ⚠️' },
            { w: '75%',  color: '#00ccff', label: 'BON 👍' },
            { w: '100%', color: '#00ff88', label: 'TRÈS FORT ✅' }
        ];

        const n = mdp.length === 0 ? niveaux[0] : niveaux[score];
        fill.style.width = n.w;
        fill.style.background = n.color;
        fill.style.boxShadow = `0 0 8px ${n.color}55`;
        text.style.color = n.color;
        text.innerText = n.label;
    }

    function finaliser() {
        const m1 = document.getElementById('mdp1').value;
        const m2 = document.getElementById('mdp2').value;
        if (m1.length < 8) { alert("Ton mot de passe doit avoir au moins 8 caractères !"); return; }
        if (m1 !== m2) { alert("Les deux mots de passe ne sont pas identiques !"); return; }
        localStorage.setItem('user_mdp', m1);
        window.location.href = 'chats.html';
    }
</script>
</body>
</html>
