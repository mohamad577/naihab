<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Commentaires</title>
    <style>
        :root { --bg-deep: #1a0b5a; --gold: #ffcc00; --glass: rgba(255,255,255,0.05); }
        body { margin:0; background-color:var(--bg-deep); font-family:'Segoe UI',sans-serif; color:white; display:flex; flex-direction:column; height:100vh; }
        .header { padding:15px 20px; display:flex; align-items:center; gap:20px; border-bottom:1px solid rgba(255,255,255,0.05); background:rgba(0,0,0,0.2); backdrop-filter:blur(10px); }
        .back-btn { font-size:22px; color:var(--gold); cursor:pointer; background:none; border:none; padding:0; }
        .comments-list { flex:1; overflow-y:auto; padding:20px 15px; display:flex; flex-direction:column; gap:20px; }
        .comment-item { display:flex; gap:12px; animation:fadeIn 0.4s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }
        .user-avatar { width:36px; height:36px; border-radius:50%; object-fit:cover; border:1.5px solid var(--gold); }
        .default-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; color:white; border:1.5px solid var(--gold); flex-shrink:0; }
        .comment-bubble { background:var(--glass); padding:12px 16px; border-radius:18px; border-top-left-radius:2px; flex:1; border:1px solid rgba(255,255,255,0.03); }
        .comment-bubble b { display:block; font-size:13px; margin-bottom:4px; color:var(--gold); }
        .comment-bubble p { margin:0; font-size:14px; color:rgba(255,255,255,0.9); line-height:1.5; word-break:break-word; }
        .comment-time { font-size:10px; opacity:0.4; margin-top:5px; }
        .input-area { padding:15px 15px 30px; background:rgba(13,18,74,0.95); display:flex; gap:12px; align-items:center; border-top:1px solid rgba(255,255,255,0.05); }
        .comment-input { flex:1; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); padding:12px 18px; border-radius:25px; color:white; outline:none; font-size:14px; transition:0.3s; }
        .comment-input:focus { border-color:var(--gold); background:rgba(255,255,255,0.12); }
        .publish-btn { background:var(--gold); border:none; color:var(--bg-deep); font-weight:800; font-size:13px; cursor:pointer; padding:10px 18px; border-radius:20px; transition:0.2s; text-transform:uppercase; }
        .publish-btn:active { transform:scale(0.9); }
        .empty-msg { text-align:center; padding:60px 20px; opacity:0.4; }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="window.history.back()">⬅️</button>
        <h3 style="margin:0; font-size:18px; font-weight:900;">Commentaires</h3>
    </div>

    <div class="comments-list" id="zone-commentaires">
        <!-- Les commentaires statiques ou sauvegardés chargeront ici -->
    </div>

    <div class="input-area">
        <input type="text" id="mon-commentaire" class="comment-input" placeholder="Ajouter un commentaire..."
               onkeydown="if(event.key==='Enter'){event.preventDefault(); publier();}">
        <button class="publish-btn" onclick="publier()">Publier</button>
    </div>

<script>
    const monNom = localStorage.getItem("user_name") || "Moi";
    const maPhoto = localStorage.getItem("user_photo");
    const urlParams = new URLSearchParams(window.location.search);
    
    // Vérification du mode démo
    const isDemo = urlParams.get('demo') === '1';
    const demoId = urlParams.get('id') || '';
    const postIndex = urlParams.get('index') || '0';
    
    // Définition de la clé unique pour séparer les commentaires démo et persos.
    // CORRECTION : chaque publication de démo (Julie, ou celles de la grille
    // recherche.html) a maintenant sa propre clé, pour ne pas mélanger leurs
    // commentaires entre elles.
    const cleCommentaires = isDemo
        ? ('naihab_commentaires_demo' + (demoId ? '_' + demoId : ''))
        : 'naihab_commentaires_' + postIndex;

    function obtenirHeure() {
        const d = new Date();
        return d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
    }

    window.onload = function() {
        const zone = document.getElementById('zone-commentaires');
        const commentairesSauvegardes = JSON.parse(localStorage.getItem(cleCommentaires));

        // Les 2 commentaires de base ne concernent que le post de démo original
        // (Julie, sans id) — les publications de la grille recherche.html démarrent vides
        if (isDemo && !demoId && !commentairesSauvegardes) {
            const demaBase = [
                { nom: "Jackson", texte: "Superbe application ! J'adore le design bleu nuit. 🔥", heure: "Il y a 2h" },
                { nom: "Naïfan_99", texte: "Est-ce qu'on pourra bientôt envoyer des vidéos ? 🌍", heure: "Il y a 1h" }
            ];
            localStorage.setItem(cleCommentaires, JSON.stringify(demaBase));
            demaBase.forEach((c, index) => afficherCommentaire(c, index, false));
            mettreAJourCompteur(demaBase.length);
        } else {
            const liste = commentairesSauvegardes || [];
            if (liste.length === 0) {
                zone.innerHTML = `<div class="empty-msg">Aucun commentaire pour le moment. Soyez le premier ! ✨</div>`;
            } else {
                liste.forEach((c, index) => afficherCommentaire(c, index, false));
            }
            mettreAJourCompteur(liste.length);
        }
    };

    function mettreAJourCompteur(nb) {
        if (isDemo) {
            let demoData = JSON.parse(localStorage.getItem('naihab_publication_demo')) || {};
            demoData.commentaires = nb;
            localStorage.setItem('naihab_publication_demo', JSON.stringify(demoData));
        } else {
            let mesPosts = JSON.parse(localStorage.getItem('naihab_posts')) || [];
            if (mesPosts[postIndex]) {
                mesPosts[postIndex].commentaires = nb;
                localStorage.setItem('naihab_posts', JSON.stringify(mesPosts));
            }
        }
    }

    function afficherCommentaire(c, index, sauvegarder = true) {
        const zone = document.getElementById('zone-commentaires');
        
        // Supprimer le message vide s'il existe
        const emptyMsg = zone.querySelector('.empty-msg');
        if (emptyMsg) emptyMsg.remove();

        const estMoi = c.nom === monNom;
        const texteSecurise = (c.texte || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        let avatarHTML = c.photo
            ? `<img src="${c.photo}" class="user-avatar" alt="${c.nom}">`
            : `<div class="default-avatar" style="background:#ffcc00; color:#1a0b5a;">${c.nom.charAt(0).toUpperCase()}</div>`;

        const div = document.createElement('div');
        div.className = 'comment-item';
        div.id = 'comment-' + index;
        div.innerHTML = `
            ${avatarHTML}
            <div class="comment-bubble" style="flex:1;">
                <b>${c.nom}</b>
                <p>${texteSecurise}</p>
                <div class="comment-time">${c.heure || ''}</div>
            </div>
            ${estMoi ? `<span onclick="supprimerCommentaire(${index})" style="font-size:18px;opacity:0.4;cursor:pointer;padding:5px;align-self:center;">🗑️</span>` : ''}
        `;

        zone.appendChild(div);
        zone.scrollTo({ top: zone.scrollHeight, behavior: 'smooth' });

        if (sauvegarder) {
            const commentairesSauvegardes = JSON.parse(localStorage.getItem(cleCommentaires)) || [];
            commentairesSauvegardes.push(c);
            localStorage.setItem(cleCommentaires, JSON.stringify(commentairesSauvegardes));
            mettreAJourCompteur(commentairesSauvegardes.length);
        }
    }

    function publier() {
        const input = document.getElementById('mon-commentaire');
        const texte = input.value.trim();
        if (texte !== "") {
            const commentairesSauvegardes = JSON.parse(localStorage.getItem(cleCommentaires)) || [];
            const index = commentairesSauvegardes.length;
            afficherCommentaire({ nom: monNom, photo: maPhoto, texte: texte, heure: obtenirHeure() }, index, true);
            input.value = "";
        }
    }

    function supprimerCommentaire(index) {
        if (confirm("Supprimer ce commentaire ?")) {
            let commentaires = JSON.parse(localStorage.getItem(cleCommentaires)) || [];
            commentaires.splice(index, 1);
            localStorage.setItem(cleCommentaires, JSON.stringify(commentaires));
            mettreAJourCompteur(commentaires.length);
            location.reload();
        }
    }
</script>
</body>
</html>
