<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        // Anti-flash : cacher la page tant que l'animation de démarrage n'est pas prête
        if (new URLSearchParams(location.search).get('splash') === '1') {
            document.documentElement.style.visibility = 'hidden';
            setTimeout(function(){ document.documentElement.style.visibility = 'visible'; }, 6000);
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Accueil</title>
    <style>
        :root {
            --bg-deep: #1a0b5a;
            --gold: #ffcc00;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { 
            margin: 0; 
            background-color: var(--bg-deep); 
            font-family: 'Segoe UI', sans-serif; 
            color: white; 
            padding-bottom: 90px;
            overflow-x: hidden;
        }
        
        /* Header */
        .header { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            background: rgba(26, 11, 90, 0.95); 
            z-index: 1000; 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header h2 {
            font-size: 24px;
            margin: 0;
            color: var(--gold);
            font-weight: 900;
        }

        .header-icons { display: flex; gap: 18px; align-items: center; }
        
        /* Status Box */
        .status-box { 
            padding: 12px 18px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            background: var(--glass); 
            margin: 15px; 
            border-radius: 25px; 
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .user-mini-img { 
            width: 35px; height: 35px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--gold); 
        }

        /* Winner Banner */
        .winner-box {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            margin: 0 15px 20px 15px;
            padding: 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #1a0b5a;
            position: relative;
        }

        .close-winner {
            position: absolute; top: 10px; right: 15px;
            font-size: 22px; cursor: pointer; line-height: 1;
        }

        .winner-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid white; }

        /* Post Structure */
        .post { 
            background: rgba(255,255,255,0.02); 
            margin-bottom: 25px; 
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .post-header { padding: 12px 15px; display: flex; align-items: center; gap: 12px; }
        .post-img { width: 100%; height: auto; display: block; cursor: pointer; }
        .post-actions { padding: 15px; display: flex; gap: 25px; align-items: center; }
        .action-btn { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; }

        /* Navigation */
        .nav-bas { 
            position: fixed; bottom: 0; width: 100%; height: 70px; 
            background: #0d124a; 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 9999; border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nav-link { text-decoration: none; font-size: 24px; opacity: 0.5; transition: 0.3s; color: white; }
        .nav-link.active { opacity: 1; color: var(--gold); transform: translateY(-3px); }

        /* 👁️ DESIGN DU SPLASH INJECTÉ DYNAMIQUEMENT */
        #dynamic-splash {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100000; transition: opacity 0.8s ease;
        }
        .dynamic-eye-container { position: relative; width: 240px; height: 120px; }
        .dynamic-eyelid-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: #000; z-index: 10;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0; transform-origin: bottom center;
            animation: ouvrirHaut 1.4s cubic-bezier(0.4,0,0.2,1) forwards 0.4s;
        }
        .dynamic-eyelid-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: #000; z-index: 10;
            border-radius: 0 0 50% 50% / 0 0 100% 100%; transform-origin: top center;
            animation: ouvrirBas 1.4s cubic-bezier(0.4,0,0.2,1) forwards 0.4s;
        }
        .dynamic-eye-inner {
            position: absolute; inset: 0; background: radial-gradient(ellipse, #1a0b5a 0%, #0a0530 100%);
            border-radius: 50% / 40%; overflow: hidden; border: 2px solid rgba(255,204,0,0.3);
        }
        .dynamic-iris {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 85px; height: 85px; border-radius: 50%;
            background: radial-gradient(circle, #ffcc00 0%, #ff9900 40%, #1a0b5a 70%); box-shadow: 0 0 30px rgba(255,204,0,0.7);
        }
        .dynamic-pupille { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 32px; height: 32px; border-radius: 50%; background: #000; }
        .dynamic-reflet { position: absolute; top: 18%; right: 22%; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.85); }
    </style>
</head>
<body>

    <header class="header">
        <h2>Naïhab</h2>
        <div class="header-icons">
            <span style="font-size: 28px; cursor: pointer; color: var(--gold);" onclick="window.location.href='creer-post.html'">⊕</span>
            <span onclick="window.location.href='discussions.html'" style="font-size: 22px; cursor: pointer;">📩</span>
        </div>
    </header>

    <div class="status-box" onclick="window.location.href='creer-post.html'">
        <img src="logo_naihab.svg" id="ma-photo-accueil" class="user-mini-img" alt="Profil">
        <span style="opacity:0.6; font-size: 14px;">Quoi de neuf ?</span>
    </div>

    <div class="winner-box" id="banner-winner" style="display:none;">
        <span class="close-winner" onclick="fermerBanniere(event)">×</span>
        <div style="display: flex; align-items: center; gap: 12px; cursor: pointer;" onclick="allerVersGagnant()">
            <img id="winner-img" src="" class="winner-img" alt="Gagnant">
            <div>
                <span style="font-size: 10px; font-weight: 800; text-transform: uppercase;">🏆 Star de la session</span>
                <b id="winner-nom" style="display: block; font-size: 15px;">👑</b>
                <span id="winner-votes" style="font-size: 11px; opacity: 0.7;"></span>
            </div>
        </div>
    </div>

    <!-- Les nouveaux posts s'affichent ici (générés en JS) -->
    <div id="flux-posts"></div>

    <!-- Post Démo (Julie) -->
    <article class="post">
        <div class="post-header">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" style="width:36px; height:36px; border-radius:50%; object-fit:cover;" alt="User">
            <b style="font-size: 14px;">Julie <span style="color: var(--gold); font-size: 11px; margin-left: 5px;">• 2h</span></b>
        </div>
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800" class="post-img" onclick="ouvrirPostDemo('publication.html')" alt="Post">
        <div class="post-actions">
            <div class="action-btn" onclick="toggleLike(this)">
                <span class="heart">🤍</span> <small>124</small>
            </div>
            <div class="action-btn" onclick="ouvrirPostDemo('commentaires.html')">
                <span>💬</span> <small id="nb-comm-demo">23</small>
            </div>
            <div class="action-btn" onclick="partager()">
                <span>✈️</span>
            </div>
        </div>
    </article>

    <nav class="nav-bas">
        <a href="chats.html" class="nav-link active">🏠</a>
        <a href="recherche.html" class="nav-link">🔍</a>
        <a href="videos.html" class="nav-link">▶️</a>
        <a href="notifications.html" class="nav-link">🔔</a>
        <a href="profil.html" class="nav-link">👤</a>
    </nav>

    <script>
        // ── GESTION DYNAMIQUE DU SPLASH SCREEN SUR L'ACCUEIL ──
        // Se déclenche dès que possible (pas besoin d'attendre le chargement complet
        // des images comme avec window.onload) pour éviter tout flash de la vraie page.
        (function() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('splash') !== '1') return;

                const splashDiv = document.createElement('div');
                splashDiv.id = 'dynamic-splash';
                splashDiv.innerHTML = `
                    <div class="dynamic-eye-container">
                        <div class="dynamic-eye-inner">
                            <div class="dynamic-iris"><div class="dynamic-pupille"><div class="dynamic-reflet"></div></div></div>
                        </div>
                        <div class="dynamic-eyelid-top"></div>
                        <div class="dynamic-eyelid-bottom"></div>
                    </div>
                `;
                document.body.appendChild(splashDiv);

                // Retirer proprement le splash après l'animation (2.5 secondes suffisent pour un utilisateur déjà connecté)
                setTimeout(() => {
                    splashDiv.style.opacity = '0';
                    setTimeout(() => { splashDiv.remove(); }, 800);
                    // On nettoie l'URL pour enlever le ?splash=1 — dans un try/catch car
                    // cette opération est bloquée par Chrome en test local (file://),
                    // ce qui ne doit pas empêcher le reste de l'animation de se terminer
                    try {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    } catch (e) { /* ignoré : normal en local file:// */ }
                }, 2500);
            } finally {
                // Quoi qu'il arrive (même en cas d'erreur imprévue ci-dessus),
                // on révèle la page — jamais bloquée en noir indéfiniment
                document.documentElement.style.visibility = 'visible';
            }
        })();

        window.onload = function() {
            // Le reste de tes fonctions d'origine
            const photoSauve = localStorage.getItem("user_photo");
            const nomSauve = localStorage.getItem("user_name") || "Moi";
            if (photoSauve) {
                document.getElementById("ma-photo-accueil").src = photoSauve;
            }

            const commsDemo = JSON.parse(localStorage.getItem('naihab_commentaires_demo')) || [
                { nom: "Jackson", texte: "Superbe application ! J'adore le design bleu nuit. 🔥", heure: "Il y a 2h" },
                { nom: "Naïfan_99", texte: "Est-ce qu'on pourra bientôt envoyer des vidéos ? 🌍", heure: "Il y a 1h" }
            ];
            document.getElementById('nb-comm-demo').innerText = commsDemo.length;

            // ── Initialiser les données de la publication démo (Julie) ──
            // Nécessaire pour que publication.html puisse afficher l'image/texte en mode ?demo=1
            if (!localStorage.getItem('naihab_publication_demo')) {
                const demo = {
                    image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800",
                    texte: "Superbe journée à explorer Naïhab ! ✨",
                    date: "2h",
                    likes: 124,
                    auteur: "Julie",
                    auteurPhoto: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100"
                };
                localStorage.setItem('naihab_publication_demo', JSON.stringify(demo));
            }

            // ── Afficher la bannière du gagnant de la couronne (si applicable) ──
            const gagnantRaw = localStorage.getItem('naihab_gagnant_couronne');
            const bannerFermee = localStorage.getItem('naihab_banniere_fermee');
            if (gagnantRaw && !bannerFermee) {
                try {
                    const gagnant = JSON.parse(gagnantRaw);
                    document.getElementById('winner-nom').innerText = '👑 ' + (gagnant.auteur || 'Naïfan');
                    document.getElementById('winner-votes').innerText = (gagnant.nbVotes || 0) + ' votes';
                    document.getElementById('banner-winner').style.display = 'flex';
                } catch (e) {
                    // Ancien format (texte simple) éventuellement laissé par un test manuel
                    document.getElementById('winner-nom').innerText = '👑 ' + gagnantRaw;
                    document.getElementById('banner-winner').style.display = 'flex';
                }
            }

            // ── Afficher les publications personnelles (créées via creer-post.html) ──
            afficherMesPosts();
        };

        // Ouvre la publication démo (Julie) vers la bonne page, en mode ?demo=1
        function ouvrirPostDemo(page) {
            window.location.href = page + '?demo=1';
        }

        // Like / unlike sur la publication démo (dans le flux chats.html)
        function toggleLike(element) {
            const heart = element.querySelector('.heart');
            const compteur = element.querySelector('small');
            let nb = parseInt(compteur.innerText) || 0;
            let demo = JSON.parse(localStorage.getItem('naihab_publication_demo')) || {};

            if (heart.innerText === '🤍') {
                heart.innerText = '❤️';
                nb++;
            } else {
                heart.innerText = '🤍';
                nb = Math.max(0, nb - 1);
            }
            compteur.innerText = nb;
            demo.likes = nb;
            localStorage.setItem('naihab_publication_demo', JSON.stringify(demo));
        }

        // Partager (démo + posts persos, bouton avion)
        function partager() {
            const lien = "https://mohamad577.github.io/naihab/MY%20APP/index.html";
            const message = "Regarde cette publication sur Naïhab ! ✨ " + lien;
            window.open("https://wa.me/?text=" + encodeURIComponent(message), '_blank');
        }

        // Fermer la bannière du gagnant de la couronne
        function fermerBanniere(event) {
            event.stopPropagation();
            document.getElementById('banner-winner').style.display = 'none';
            localStorage.setItem('naihab_banniere_fermee', '1');
        }

        // Aller voir le profil du gagnant de la couronne
        function allerVersGagnant() {
            const gagnantRaw = localStorage.getItem('naihab_gagnant_couronne');
            if (gagnantRaw) {
                try {
                    const gagnant = JSON.parse(gagnantRaw);
                    window.location.href = 'profil-public.html?name=' + encodeURIComponent(gagnant.auteur || '');
                } catch (e) {
                    window.location.href = 'profil-public.html?name=' + encodeURIComponent(gagnantRaw);
                }
            }
        }

        // Construit et affiche les publications personnelles de l'utilisateur dans #flux-posts
        function afficherMesPosts() {
            const zone = document.getElementById('flux-posts');
            const posts = JSON.parse(localStorage.getItem('naihab_posts')) || [];
            const nomSauve = localStorage.getItem('user_name') || 'Moi';
            const photoSauve = localStorage.getItem('user_photo') || 'logo_naihab.svg';

            zone.innerHTML = '';

            posts.forEach((post, index) => {
                const coeur = post.liked ? '❤️' : '🤍';
                const nbLikes = post.likes || 0;
                const nbComm = post.commentaires || 0;

                const article = document.createElement('article');
                article.className = 'post';
                article.innerHTML = `
                    <div class="post-header">
                        <img src="${photoSauve}" style="width:36px; height:36px; border-radius:50%; object-fit:cover;" alt="User">
                        <b style="font-size: 14px;">${nomSauve} <span style="color: var(--gold); font-size: 11px; margin-left: 5px;">• maintenant</span></b>
                    </div>
                    <img src="${post.image}" class="post-img" data-index="${index}" alt="Post">
                    <div class="post-actions">
                        <div class="action-btn like-btn" data-index="${index}">
                            <span class="heart">${coeur}</span> <small>${nbLikes}</small>
                        </div>
                        <div class="action-btn comment-btn" data-index="${index}">
                            <span>💬</span> <small>${nbComm}</small>
                        </div>
                        <div class="action-btn" onclick="partager()">
                            <span>✈️</span>
                        </div>
                    </div>
                `;
                zone.appendChild(article);
            });

            // Clic sur l'image → ouvrir la publication
            zone.querySelectorAll('.post-img').forEach(img => {
                img.addEventListener('click', () => {
                    window.location.href = 'publication.html?index=' + img.dataset.index;
                });
            });

            // Clic sur like
            zone.querySelectorAll('.like-btn').forEach(btn => {
                btn.addEventListener('click', () => toggleLikeReal(btn, parseInt(btn.dataset.index)));
            });

            // Clic sur commentaires
            zone.querySelectorAll('.comment-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    window.location.href = 'commentaires.html?index=' + btn.dataset.index;
                });
            });
        }

        // Like / unlike sur une publication personnelle (met à jour naihab_posts avec le bon index)
        function toggleLikeReal(element, index) {
            const heart = element.querySelector('.heart');
            const compteur = element.querySelector('small');
            let nb = parseInt(compteur.innerText) || 0;
            let posts = JSON.parse(localStorage.getItem('naihab_posts')) || [];

            if (heart.innerText === '🤍') {
                heart.innerText = '❤️';
                nb++;
                if (posts[index]) { posts[index].likes = nb; posts[index].liked = true; }
            } else {
                heart.innerText = '🤍';
                nb = Math.max(0, nb - 1);
                if (posts[index]) { posts[index].likes = nb; posts[index].liked = false; }
            }
            compteur.innerText = nb;
            localStorage.setItem('naihab_posts', JSON.stringify(posts));
        }
    </script>
</body>
</html>
