<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ✅ ŒEIL QUI S'OUVRE */
        .eye-container {
            position: relative;
            width: 260px;
            height: 130px;
            margin-bottom: 40px;
        }

        .eye {
            position: relative;
            width: 260px;
            height: 130px;
        }

        /* Paupière du haut */
        .eyelid-top {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 50%;
            background: #000;
            z-index: 10;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            transform-origin: bottom center;
            animation: ouvrirHaut 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.5s;
        }

        /* Paupière du bas */
        .eyelid-bottom {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 50%;
            background: #000;
            z-index: 10;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            transform-origin: top center;
            animation: ouvrirBas 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.5s;
        }

        @keyframes ouvrirHaut {
            from { transform: scaleY(1); }
            to { transform: scaleY(0); }
        }

        @keyframes ouvrirBas {
            from { transform: scaleY(1); }
            to { transform: scaleY(0); }
        }

        /* Intérieur de l'œil */
        .eye-inner {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse, #1a0b5a 0%, #0a0530 100%);
            border-radius: 50% / 40%;
            overflow: hidden;
            border: 2px solid rgba(255,204,0,0.3);
        }

        /* Iris */
        .iris {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90px; height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffcc00 0%, #ff9900 40%, #1a0b5a 70%);
            box-shadow: 0 0 30px rgba(255,204,0,0.6), 0 0 60px rgba(255,204,0,0.3);
            animation: pulserIris 2s ease-in-out infinite 2s;
        }

        @keyframes pulserIris {
            0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 30px rgba(255,204,0,0.6); }
            50% { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 0 50px rgba(255,204,0,0.9); }
        }

        /* Pupille */
        .pupille {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 35px; height: 35px;
            border-radius: 50%;
            background: #000;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* Reflet */
        .reflet {
            position: absolute;
            top: 20%; right: 25%;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
        }

        /* Lumières blanches qui rayonnent */
        .lumiere {
            position: absolute;
            top: 50%; left: 50%;
            width: 2px;
            background: linear-gradient(to right, transparent, rgba(255,204,0,0.6), transparent);
            transform-origin: left center;
            opacity: 0;
            animation: rayonner 0.5s ease forwards;
        }

        @keyframes rayonner {
            from { opacity: 0; width: 2px; }
            to { opacity: 1; width: 60px; }
        }

        /* Logo qui apparaît */
        .logo-container {
            text-align: center;
            opacity: 0;
            animation: apparaitreLogoOeil 0.8s ease forwards 2.2s;
        }

        @keyframes apparaitreLogoOeil {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-text {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #ffcc00 60%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .slogan {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* Barre de chargement */
        .loader-container {
            position: absolute;
            bottom: 80px;
            width: 180px;
            opacity: 0;
            animation: apparaitreLogoOeil 0.5s ease forwards 2.5s;
        }

        .loader-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .loader-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffcc00, #ff9900);
            border-radius: 10px;
            animation: charger 1.8s ease forwards 2.7s;
            box-shadow: 0 0 10px rgba(255,204,0,0.5);
        }

        @keyframes charger {
            from { width: 0%; }
            to { width: 100%; }
        }

        .loader-text {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- ✅ ŒEIL QUI S'OUVRE -->
    <div class="eye-container">
        <div class="eye">
            <div class="eye-inner">
                <div class="iris">
                    <div class="pupille">
                        <div class="reflet"></div>
                    </div>
                </div>
            </div>
            <div class="eyelid-top"></div>
            <div class="eyelid-bottom"></div>
        </div>
    </div>

    <!-- Logo Naïhab -->
    <div class="logo-container">
        <div class="logo-text">Naïhab</div>
        <p class="slogan">Ta zone, ton style, ta liberté</p>
    </div>

    <!-- Barre de chargement -->
    <div class="loader-container">
        <div class="loader-bar">
            <div class="loader-fill"></div>
        </div>
        <div class="loader-text">Chargement...</div>
    </div>

    <script>
        // ✅ Redirection intelligente après 5 secondes (fin de l'animation)
        setTimeout(() => {
            document.body.style.transition = 'opacity 0.6s ease';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                // On vérifie si l'utilisateur s'est déjà connecté auparavant
                const userConnecte = localStorage.getItem("user_name");
                
                if (userConnecte) {
                    // Si connecté, on l'envoie sur sa page choisie (ou chats.html par défaut)
                    const pageChoisie = localStorage.getItem("naihab_page_accueil_choisie") || "chats.html";
                    window.location.href = pageChoisie;
                } else {
                    // Si c'est la première fois, direction l'inscription
                    window.location.href = 'index.html';
                }
            }, 600);
        }, 5000);
    </script>

</body>
</html>
