<!DOCTYPE html>
<html lang="fr">
<head>
    <script type="module" src="firebase-config.js"></script>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Connexion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a0b5a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .header-title {
            margin-top: 70px;
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            color: #ffcc00;
        }

        .input-group {
            width: 85%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field-box {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #ffcc00;
        }

        .btn-main {
            width: 100%;
            padding: 18px;
            border-radius: 30px;
            border: none;
            background-color: #ffcc00;
            color: #1a0b5a;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-main.loading {
            background: rgba(255,204,0,0.3);
            color: transparent;
            pointer-events: none;
        }

        .btn-main.loading::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 24px; height: 24px;
            margin: -12px 0 0 -12px;
            border: 3px solid rgba(255,204,0,0.3);
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: tourner 0.7s linear infinite;
        }

        .btn-main.success {
            background: #2ecc71;
            color: white;
            pointer-events: none;
        }

        @keyframes tourner {
            to { transform: rotate(360deg); }
        }

        .link-text {
            margin-top: 25px;
            font-size: 14px;
            color: #ffcc00;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-secondary {
            position: absolute;
            bottom: 40px;
            width: 85%;
            max-width: 350px;
            padding: 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>Bon retour !</h1>
    </div>

    <div class="input-group">
        <div class="field-box">
            <input type="email" placeholder="Email">
        </div>

        <div class="field-box">
            <input type="password" placeholder="Mot de passe">
        </div>

        <button class="btn-main" onclick="seConnecter()">SE CONNECTER</button>
    </div>

    <div class="link-text" onclick="window.location.href='recuperation.html'">Mot de passe oublié ?</div>

    <button class="btn-secondary" onclick="window.location.href='inscription.html'">Créer un compte</button>

    <script type="module">
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { auth } from './firebase-config.js';

        // ✅ Si déjà connecté → rediriger directement
        if (localStorage.getItem('user_name') && localStorage.getItem('naihab_connecte')) {
            const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
            window.location.href = pageAccueil;
        }

        // Messages d'erreur Firebase traduits en français
        function traduireErreur(code) {
            switch (code) {
                case 'auth/invalid-email':
                    return "L'adresse email n'est pas valide.";
                case 'auth/user-not-found':
                case 'auth/invalid-credential':
                    return "Aucun compte ne correspond à cet email et ce mot de passe.";
                case 'auth/wrong-password':
                    return "Mot de passe incorrect !";
                case 'auth/too-many-requests':
                    return "Trop de tentatives. Réessaie dans quelques minutes.";
                case 'auth/network-request-failed':
                    return "Problème de connexion internet. Réessaie.";
                default:
                    return "Une erreur est survenue. Réessaie.";
            }
        }

        window.seConnecter = async function() {
            const email = document.querySelector('input[type="email"]').value.trim();
            const mdp = document.querySelector('input[type="password"]').value.trim();
            const btn = document.querySelector('.btn-main');

            if (!email) { alert("Entre ton email !"); return; }
            if (!mdp) { alert("Entre ton mot de passe !"); return; }

            btn.classList.add('loading');

            try {
                const cred = await signInWithEmailAndPassword(auth, email, mdp);

                btn.classList.remove('loading');
                btn.classList.add('success');
                btn.innerText = "Connexion réussie ✓";

                // On garde ces infos en local pour que le reste de l'app
                // (qui lit encore le localStorage) continue de fonctionner
                localStorage.setItem('user_name', cred.user.displayName || email);
                localStorage.setItem('user_email', email);
                localStorage.setItem('naihab_connecte', 'oui');
                localStorage.setItem('naihab_uid', cred.user.uid);

                setTimeout(() => {
                    const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
                    window.location.href = pageAccueil;
                }, 800);
            } catch (err) {
                btn.classList.remove('loading');
                alert(traduireErreur(err.code));
            }
        };
    </script>

</body>
</html>
