<!DOCTYPE html>
<html lang="fr">
<head>
    <script type="module" src="firebase-config.js"></script>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Connexion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a0b5a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .header-title {
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            color: #ffcc00;
        }

        p.sous-titre { opacity: 0.75; font-size: 14px; text-align: center; max-width: 280px; margin-top: 10px; }

        .btn-google {
            width: 85%;
            max-width: 350px;
            padding: 18px;
            background: white;
            color: #333;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
        }

        .btn-google.loading {
            color: transparent;
            pointer-events: none;
        }

        .btn-google.loading::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 24px; height: 24px;
            margin: -12px 0 0 -12px;
            border: 3px solid rgba(26,11,90,0.2);
            border-top-color: #1a0b5a;
            border-radius: 50%;
            animation: tourner 0.7s linear infinite;
        }

        @keyframes tourner {
            to { transform: rotate(360deg); }
        }

        .btn-secondary {
            margin-top: 30px;
            width: 85%;
            max-width: 350px;
            padding: 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>Bon retour !</h1>
        <p class="sous-titre">Dans l'univers de Naïhab, tu es libre.</p>
    </div>

    <button class="btn-google" onclick="seConnecter()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.94H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.06l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continuer avec Google
    </button>

    <button class="btn-secondary" onclick="window.location.href='inscription.html'">Créer un compte</button>

    <script type="module">
        import { GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { auth, db } from './firebase-config.js';

        // ✅ Si déjà connecté → rediriger directement
        if (localStorage.getItem('user_name') && localStorage.getItem('naihab_connecte')) {
            const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
            window.location.href = pageAccueil;
        }

        function traduireErreur(code) {
            switch (code) {
                case 'auth/popup-closed-by-user':
                    return "Fenêtre Google fermée avant la fin. Réessaie.";
                case 'auth/network-request-failed':
                    return "Problème de connexion internet. Réessaie.";
                default:
                    return "Une erreur est survenue. Réessaie.";
            }
        }

        window.seConnecter = async function() {
            const provider = new GoogleAuthProvider();
            const btn = document.querySelector('.btn-google');
            btn.classList.add('loading');

            try {
                await signOut(auth);
                const cred = await signInWithPopup(auth, provider);
                const user = cred.user;

                // On lit le profil existant dans Firestore (nom/photo peuvent avoir
                // été modifiés depuis la version Google d'origine)
                const profilRef = doc(db, 'utilisateurs', user.uid);
                const profilSnap = await getDoc(profilRef);

                let nom, photo;
                if (profilSnap.exists()) {
                    const data = profilSnap.data();
                    nom = data.nom || user.displayName || user.email;
                    photo = data.photo || user.photoURL || '';
                } else {
                    // Sécurité : si le profil n'existe pas encore (compte créé
                    // avant cette mise à jour), on le crée maintenant
                    nom = user.displayName || user.email;
                    photo = user.photoURL || '';
                    await setDoc(profilRef, {
                        nom: nom,
                        email: user.email,
                        photo: photo,
                        dateCreation: new Date().toISOString()
                    });
                }

                localStorage.setItem('user_name', nom);
                localStorage.setItem('user_email', user.email);
                if (photo) localStorage.setItem('user_photo', photo);
                localStorage.setItem('naihab_connecte', 'oui');
                localStorage.setItem('naihab_uid', user.uid);

                const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
                window.location.href = pageAccueil;
            } catch (err) {
                btn.classList.remove('loading');
                alert(traduireErreur(err.code));
            }
        };
    </script>

</body>
</html>
