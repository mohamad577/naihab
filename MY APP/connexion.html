<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Connexion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a0b5a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .header-title {
            margin-top: 70px;
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            color: #ffcc00;
        }

        .input-group {
            width: 85%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field-box {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 18px 20px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #ffcc00;
        }

        .btn-main {
            width: 100%;
            padding: 18px;
            border-radius: 30px;
            border: none;
            background-color: #ffcc00;
            color: #1a0b5a;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-main.loading {
            background: rgba(255,204,0,0.3);
            color: transparent;
            pointer-events: none;
        }

        .btn-main.loading::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 24px; height: 24px;
            margin: -12px 0 0 -12px;
            border: 3px solid rgba(255,204,0,0.3);
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: tourner 0.7s linear infinite;
        }

        .btn-main.success {
            background: #2ecc71;
            color: white;
            pointer-events: none;
        }

        @keyframes tourner {
            to { transform: rotate(360deg); }
        }

        .link-text {
            margin-top: 25px;
            font-size: 14px;
            color: #ffcc00;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-secondary {
            position: absolute;
            bottom: 40px;
            width: 85%;
            max-width: 350px;
            padding: 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>Bon retour !</h1>
    </div>

    <div class="input-group">
        <div class="field-box">
            <input type="text" placeholder="Pseudo ou Numéro">
        </div>
        
        <div class="field-box">
            <input type="password" placeholder="Mot de passe">
        </div>

        <button class="btn-main" onclick="seConnecter()">SE CONNECTER</button>
    </div>

    <div class="link-text" onclick="window.location.href='recuperation.html'">Mot de passe oublié ?</div>

    <button class="btn-secondary" onclick="window.location.href='inscription.html'">Créer un compte</button>

    <script>
        // ✅ Si déjà connecté → rediriger directement
        if (localStorage.getItem('user_name') && localStorage.getItem('naihab_connecte')) {
            const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
            window.location.href = pageAccueil;
        }

        function seConnecter() {
            const pseudo = document.querySelector('input[type="text"]').value.trim();
            const mdp = document.querySelector('input[type="password"]').value.trim();
            const btn = document.querySelector('.btn-main');

            if (!pseudo) { alert("Entre ton pseudo ou numéro !"); return; }
            if (!mdp) { alert("Entre ton mot de passe !"); return; }

            // CORRECTION IMPORTANTE : le mot de passe n'était jamais vérifié —
            // n'importe quel mot de passe non vide était accepté. On compare
            // maintenant avec celui enregistré lors de l'inscription.
            const mdpEnregistre = localStorage.getItem('user_mdp');
            if (mdpEnregistre && mdp !== mdpEnregistre) {
                alert("Mot de passe incorrect !");
                return;
            }

            // CORRECTION IMPORTANTE : le pseudo tapé n'était lui non plus jamais
            // vérifié — n'importe quel texte fonctionnait tant que le mot de passe
            // était bon. On compare maintenant avec le pseudo enregistré.
            const nomEnregistre = localStorage.getItem('user_name');
            if (nomEnregistre && pseudo.toLowerCase() !== nomEnregistre.toLowerCase()) {
                alert("Pseudo ou numéro introuvable !");
                return;
            }

            // ✅ Animation chargement
            btn.classList.add('loading');

            setTimeout(() => {
                // ✅ Animation succès
                btn.classList.remove('loading');
                btn.classList.add('success');
                btn.innerText = "Connexion réussie ✓";

                if (!localStorage.getItem('user_name')) {
                    localStorage.setItem('user_name', pseudo);
                }
                // ✅ Marquer comme connecté
                localStorage.setItem('naihab_connecte', 'oui');

                setTimeout(() => {
                    // ✅ Rediriger vers la page d'accueil choisie
                    const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
                    window.location.href = pageAccueil;
                }, 800);
            }, 1500);
        }
    </script>

</body>
</html>
