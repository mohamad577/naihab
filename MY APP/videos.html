<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script>
        // Anti-flash : cacher la page tant que l'animation de démarrage n'est pas prête
        if (new URLSearchParams(location.search).get('splash') === '1') {
            document.documentElement.style.visibility = 'hidden';
            setTimeout(function(){ document.documentElement.style.visibility = 'visible'; }, 6000);
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Vidéos</title>
    <style>
        :root {
            --gold: #ffcc00;
            --gold-glow: rgba(255,204,0,0.35);
            --bg-dark: #0d0840;
            --bg-nav: rgba(13,8,64,0.97);
            --red: #ff4757;
            --glass: rgba(255,255,255,0.12);
            --glass-dark: rgba(0,0,0,0.4);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%; background: #000;
            overflow: hidden; font-family: 'Segoe UI', sans-serif;
        }

        /* ── GRILLE DE DÉFILEMENT PRINCIPALE ── */
        .video-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            width: 100%;
            scrollbar-width: none;
        }
        .video-container::-webkit-scrollbar { display: none; }

        .video-card {
            height: 100vh; width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            background: #000; overflow: hidden;
        }

        video {
            height: 100%; width: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* Dégradé bas de vidéo */
        .overlay {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 65%;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            pointer-events: none; z-index: 5;
        }

        /* ── PAUSE INDICATOR ── */
        .pause-indicator {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px; opacity: 0;
            transition: opacity 0.3s; z-index: 20;
            pointer-events: none;
        }
        .pause-indicator.show { opacity: 1; }

        /* ── BOUTONS ACTIONS (droite) ── */
        .actions {
            position: absolute; right: 15px; bottom: 130px;
            display: flex; flex-direction: column;
            gap: 18px; align-items: center; z-index: 10;
        }

        .action-btn {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            cursor: pointer; color: white;
        }

        .icon-bg {
            width: 52px; height: 52px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            transition: transform 0.25s cubic-bezier(0.175,0.885,0.32,1.275), background 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .action-btn:active .icon-bg { transform: scale(0.88); }

        .action-btn span {
            font-size: 11px; font-weight: 700;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* États actifs des boutons */
        .like-active { background: rgba(255,71,87,0.35) !important; border-color: var(--red) !important; }
        .crown-active { background: var(--gold-glow) !important; border-color: var(--gold) !important; box-shadow: 0 0 18px var(--gold-glow) !important; }
        .pin-active { background: rgba(100,180,255,0.3) !important; border-color: #64b4ff !important; }

        /* ── INFOS VIDÉO (gauche bas) ── */
        .video-info {
            position: absolute; bottom: 140px; left: 15px;
            color: white; z-index: 10; max-width: 62%;
        }
        .user-name {
            font-weight: 800; font-size: 15px;
            color: var(--gold);
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .description {
            font-size: 13px; line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            opacity: 0.95;
        }

        /* ── BARRE DE PROGRESSION ── */
        .progress-bar-container {
            position: absolute; bottom: 75px; left: 0; right: 0;
            height: 3px; background: rgba(255,255,255,0.15); z-index: 10;
        }
        .progress-bar {
            height: 100%; background: var(--gold);
            width: 0%; transition: width 0.5s linear;
        }

        /* ── TIROIR LATÉRAL ── */
        #drawer-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0); z-index: 200;
            pointer-events: none;
            transition: background 0.3s;
        }
        #drawer-overlay.open {
            background: rgba(0,0,0,0.6);
            pointer-events: all;
        }

        #drawer {
            position: fixed; top: 0; right: -82%;
            width: 78%; height: 100%;
            background: linear-gradient(160deg, #0d0840 0%, #1a0b5a 60%, #0d1855 100%);
            z-index: 201; transition: right 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
            border-left: 1px solid rgba(255,204,0,0.15);
            display: flex; flex-direction: column;
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        #drawer.open { right: 0; }

        .drawer-header {
            padding: 55px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(0,0,0,0.2);
        }
        .drawer-logo {
            font-size: 22px; font-weight: 900;
            color: var(--gold); letter-spacing: -0.5px;
        }
        .drawer-logo span { color: white; }
        .drawer-subtitle { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; text-transform: uppercase; letter-spacing: 1.5px; }

        .drawer-section-title {
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--gold); opacity: 0.7;
            padding: 20px 20px 8px;
        }

        /* Vidéos publiées dans le tiroir */
        .drawer-video-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 20px; cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .drawer-video-item:active { background: rgba(255,255,255,0.05); }
        .drawer-thumb {
            width: 54px; height: 54px; border-radius: 12px;
            background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .drawer-thumb video { width: 100%; height: 100%; object-fit: cover; }
        .drawer-video-info { flex: 1; overflow: hidden; }
        .drawer-video-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .drawer-video-meta { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
        .drawer-pin-icon { font-size: 14px; opacity: 0.4; }
        .drawer-pin-icon.epinglee { opacity: 1; color: #64b4ff; }

        /* Zone vide tiroir */
        .drawer-empty {
            padding: 30px 20px; text-align: center;
            color: rgba(255,255,255,0.3); font-size: 13px; line-height: 1.6;
        }

        /* Flèche pour ouvrir le tiroir */
        .drawer-arrow {
            position: fixed; right: 0; top: 50%;
            transform: translateY(-50%);
            background: var(--bg-nav);
            border-left: 1px solid rgba(255,204,0,0.2);
            border-radius: 12px 0 0 12px;
            padding: 14px 8px;
            font-size: 14px; color: var(--gold);
            z-index: 150; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            box-shadow: -4px 0 15px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        .drawer-arrow:active { transform: translateY(-50%) scale(0.95); }
        .drawer-arrow-text { font-size: 9px; font-weight: 800; writing-mode: vertical-rl; letter-spacing: 1px; opacity: 0.7; }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 95px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(255,204,0,0.95); color: #0d0840;
            padding: 10px 22px; border-radius: 25px;
            font-weight: 800; font-size: 13px; z-index: 9999;
            opacity: 0; transition: all 0.3s; pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── NAV BAS ── */
        .nav-bas {
            position: fixed; bottom: 0; width: 100%; height: 72px;
            background: var(--bg-nav);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100; border-top: 1px solid rgba(255,255,255,0.06);
        }
        .nav-link {
            text-decoration: none; font-size: 24px;
            color: white; opacity: 0.35; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .nav-link.active { color: var(--gold); opacity: 1; }
        .nav-dot { width: 4px; height: 4px; background: var(--gold); border-radius: 50%; opacity: 0; transition: 0.3s; }
        .nav-link.active .nav-dot { opacity: 1; }

        /* ── INDICATEUR DÉFILEMENT ── */
        .scroll-hint {
            position: absolute; bottom: 85px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5); font-size: 11px;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            z-index: 10; animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }
    </style>
</head>
<body>

<!-- TOAST GLOBAL -->
<div class="toast" id="toast-global"></div>

<!-- FLÈCHE TIROIR -->
<div class="drawer-arrow" onclick="ouvrirTiroir()" id="drawer-arrow">
    <span>📋</span>
    <span class="drawer-arrow-text">ENREGISTRÉS</span>
</div>

<!-- OVERLAY + TIROIR -->

<div id="drawer">

        <div class="drawer-subtitle">Vidéos enregistrées</div>

<div class="video-container" id="mainVideoContainer">

<nav class="nav-bas">
    <a href="chats.html" class="nav-link">🏠<div class="nav-dot"></div></a>
    <a href="recherche.html" class="nav-link">🔍<div class="nav-dot"></div></a>

<script>
const monId = localStorage.getItem('naihab_user_id') || 'u_' + Date.now();
localStorage.setItem('naihab_user_id', monId);
const monNom = localStorage.getItem('user_name') || 'Moi';

// ── INIT ──
window.addEventListener('load', () => {
    chargerVideosPubliees();
    initialiserCartes();
    observerDefilement();
    restaurerEpinglee();

    // Swipe pour ouvrir tiroir
    let startX = 0;
    document.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
    document.addEventListener('touchend', e => {
        const diff = startX - e.changedTouches[0].clientX;
        if (diff > 60 && startX > window.innerWidth * 0.5) ouvrirTiroir();
        if (diff < -60) fermerTiroir();
    });
});

// ── CHARGER VIDÉOS ÉPINGLÉES DANS LE TIROIR ──
function chargerVideosPubliees() {
    const container = document.getElementById('mainVideoContainer');
    const mesVideos = JSON.parse(localStorage.getItem('naihab_videos')) || [];
    const liste = document.getElementById('drawer-liste');

    // D'abord insérer les vidéos publiées dans la grille (sans les mettre dans le tiroir)
    mesVideos.forEach((vid, index) => {
        const carte = creerCarteVideo(vid, index);
        container.insertBefore(carte, container.firstChild);
    });

    // Remplir le tiroir uniquement avec les vidéos épinglées
    rafraichirTiroir();
}

// ── REMPLIR LE TIROIR AVEC LES ÉPINGLÉES ──
function rafraichirTiroir() {
    const liste = document.getElementById('drawer-liste');
    const epinglees = JSON.parse(localStorage.getItem('naihab_epinglees')) || [];

    if (epinglees.length === 0) {
        liste.innerHTML = `
            <div class="drawer-empty">
                📌 Aucune vidéo enregistrée.<br><br>
                Appuie sur 📌 sur une vidéo pour l'enregistrer ici et la retrouver facilement !
            </div>`;
        return;
    }

    liste.innerHTML = '';
    epinglees.forEach((ep, i) => {
        const item = document.createElement('div');
        item.className = 'drawer-video-item';
        item.id = 'drawer-ep-' + ep.id;
        item.innerHTML = `
            <div class="drawer-thumb">${ep.emoji || '🎬'}</div>
            <div class="drawer-video-info">
                <div class="drawer-video-title">${ep.auteur || '@Naïfan'}</div>
                <div class="drawer-video-meta">${ep.desc || ''}</div>
            </div>
            <span onclick="retirerEpinglee(event, '${ep.id}')" style="font-size:18px; opacity:0.5; padding:5px; cursor:pointer;">✕</span>
        `;
        item.querySelector('.drawer-video-info').addEventListener('click', () => {
            allerVersVideoParId(ep.id);
            fermerTiroir();
        });
        liste.appendChild(item);
    });
}

// ── RETIRER UNE ÉPINGLÉE DU TIROIR ──
function retirerEpinglee(event, id) {
    event.stopPropagation();
    let epinglees = JSON.parse(localStorage.getItem('naihab_epinglees')) || [];
    epinglees = epinglees.filter(ep => ep.id !== id);
    localStorage.setItem('naihab_epinglees', JSON.stringify(epinglees));

    // Désactiver le bouton épingle sur la carte
    const card = document.querySelector(`.video-card[data-id="${id}"]`);
    if (card) {
        const pinBox = card.querySelector('.pin-box');
        const pinLabel = card.querySelector('[data-action="epingler"] span:last-child');
        if (pinBox) pinBox.classList.remove('pin-active');
        if (pinLabel) pinLabel.innerText = 'Épingler';
    }

    rafraichirTiroir();
    afficherToast('Retiré des enregistrements');
}

// ── CRÉER CARTE VIDÉO ──
function creerCarteVideo(vid, index) {
    const votes = JSON.parse(localStorage.getItem('naihab_votes_' + index)) || [];
    const liked = JSON.parse(localStorage.getItem('naihab_likes_' + index)) || false;
    const epinglee = localStorage.getItem('naihab_video_epinglee') === index.toString();

    const div = document.createElement('div');
    div.className = 'video-card';
    div.dataset.id = index;
    div.dataset.auteur = vid.auteur || monNom;
    div.dataset.desc = vid.titre || '';
    div.dataset.likes = vid.likes || 0;
    div.innerHTML = `
        <video loop muted playsinline>
            <source src="${vid.url}" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <div class="pause-indicator">⏸</div>
        <div class="progress-bar-container"><div class="progress-bar"></div></div>
    `;
    return div;
}

// ── INITIALISER TOUTES LES CARTES ──
function initialiserCartes() {
    document.querySelectorAll('.video-card').forEach(card => {
        const id = card.dataset.id;
        const liked = localStorage.getItem('naihab_like_' + id) === '1';
        const votes = JSON.parse(localStorage.getItem('naihab_votes_' + id)) || [];
        const voteActif = votes.includes(monId);
        const epinglee = localStorage.getItem('naihab_video_epinglee') === id;
        const likes = card.dataset.likes || 0;
        card.dataset.rawLikes = likes; // nombre exact utilisé pour le calcul, indépendant de l'affichage "k"

        // Infos vidéo
        const info = document.createElement('div');
        info.className = 'video-info';
        info.innerHTML = `
            <div class="user-name">${card.dataset.auteur || '@Naïfan'}</div>
            <div class="description">${card.dataset.desc || ''}</div>
        `;
        card.appendChild(info);

        // Boutons actions
        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.innerHTML = `
            <div class="action-btn" data-action="son">
                <div class="icon-bg">🔇</div>
            </div>
            <div class="action-btn" data-action="like">
                <div class="icon-bg ${liked ? 'like-active' : ''}">${liked ? '❤️' : '🤍'}</div>
                <span class="likes-count">${formaterNombre(parseInt(likes))}</span>
            </div>
            <div class="action-btn" data-action="comment">
                <div class="icon-bg">💬</div>
                <span>${(JSON.parse(localStorage.getItem('naihab_commentaires_' + id)) || []).length}</span>
            </div>
            <div class="action-btn" data-action="vote">
                <div class="icon-bg crown-box ${voteActif ? 'crown-active' : ''}">👑</div>
                <span class="votes-count">${votes.length}</span>
            </div>
            <div class="action-btn" data-action="partager">
                <div class="icon-bg">✈️</div>
                <span>Partager</span>
            </div>
            <div class="action-btn" data-action="epingler">
                <div class="icon-bg pin-box ${epinglee ? 'pin-active' : ''}">📌</div>
                <span>${epinglee ? 'Épinglé' : 'Épingler'}</span>
            </div>
        `;
        card.appendChild(actions);

        // Clics boutons
        actions.querySelectorAll('.action-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                const action = btn.dataset.action;
                if (action === 'son') toggleSon(btn, card);
                else if (action === 'like') toggleLike(btn, id);
                else if (action === 'comment') allerCommentaires(id);
                else if (action === 'vote') voter(btn, id);
                else if (action === 'partager') partager();
                else if (action === 'epingler') epinglerVideo(btn, id, card);
            });
        });

        // Clic vidéo = pause/lecture
        const video = card.querySelector('video');
        const pauseIndicator = card.querySelector('.pause-indicator');
        video.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                pauseIndicator.classList.remove('show');
            } else {
                video.pause();
                pauseIndicator.classList.add('show');
                setTimeout(() => pauseIndicator.classList.remove('show'), 800);
            }
        });

        // Barre de progression
        video.addEventListener('timeupdate', () => {
            const barre = card.querySelector('.progress-bar');
            if (video.duration) barre.style.width = (video.currentTime / video.duration * 100) + '%';
        });
    });
}

// ── OBSERVER DÉFILEMENT (pause/lecture automatique) ──
function observerDefilement() {
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            const video = entry.target.querySelector('video');
            if (!video) return;
            if (entry.isIntersecting) {
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        });
    }, { threshold: 0.65 });
    document.querySelectorAll('.video-card').forEach(c => observer.observe(c));
}

// ── SON ──
function toggleSon(btn, card) {
    const video = card.querySelector('video');
    const icon = btn.querySelector('.icon-bg');
    if (!video) return;

    if (video.muted) {
        // On coupe d'abord le son de toutes les autres vidéos (une seule à la fois)
        document.querySelectorAll('.video-card video').forEach(v => { v.muted = true; });
        document.querySelectorAll('.action-btn[data-action="son"] .icon-bg').forEach(i => { i.innerText = '🔇'; });

        video.muted = false;
        icon.innerText = '🔊';
    } else {
        video.muted = true;
        icon.innerText = '🔇';
    }
}

// ── LIKE ──
function toggleLike(btn, id) {
    const icon = btn.querySelector('.icon-bg');
    const countEl = btn.querySelector('.likes-count');
    const card = btn.closest('.video-card');
    const estLike = localStorage.getItem('naihab_like_' + id) === '1';
    // On lit le nombre RÉEL stocké sur la carte (jamais le texte affiché,
    // qui peut être arrondi en "1.2k" — c'était la cause du bug de comptage)
    let nb = parseInt(card.dataset.rawLikes) || 0;

    if (!estLike) {
        icon.innerText = '❤️'; icon.classList.add('like-active');
        localStorage.setItem('naihab_like_' + id, '1');
        nb++; afficherToast('Aimé ! ❤️');
        icon.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:300});
    } else {
        icon.innerText = '🤍'; icon.classList.remove('like-active');
        localStorage.setItem('naihab_like_' + id, '0');
        nb = Math.max(0, nb - 1);
    }
    card.dataset.rawLikes = nb;
    countEl.innerText = formaterNombre(nb);

    // Sauvegarder dans naihab_videos si c'est une vraie vidéo
    const index = parseInt(id);
    if (!isNaN(index)) {
        let mesVideos = JSON.parse(localStorage.getItem('naihab_videos')) || [];
        if (mesVideos[index]) { mesVideos[index].likes = nb; localStorage.setItem('naihab_videos', JSON.stringify(mesVideos)); }
    }
}

// ── VOTE COURONNE ──
function voter(btn, id) {
    const box = btn.querySelector('.crown-box');
    const countEl = btn.querySelector('.votes-count');
    const cleVotes = 'naihab_votes_' + id;
    let votes = JSON.parse(localStorage.getItem(cleVotes)) || [];
    let nb = parseInt(countEl.innerText) || 0;

    if (!votes.includes(monId)) {
        votes.push(monId); nb++;
        box.classList.add('crown-active');
        afficherToast('Vote 👑 enregistré !');
    } else {
        votes = votes.filter(v => v !== monId); nb = Math.max(0, nb - 1);
        box.classList.remove('crown-active');
        afficherToast('Vote retiré');
    }
    localStorage.setItem(cleVotes, JSON.stringify(votes));
    countEl.innerText = nb;
    calculerGagnant();
    // Mettre à jour tiroir
    const meta = document.querySelector(`#drawer-item-${id} .drawer-video-meta`);
    if (meta) meta.innerHTML = `❤️ ${document.querySelector(`[data-id="${id}"] .likes-count`)?.innerText || 0} · 👑 ${nb} votes`;
}

// ── ÉPINGLER / ENREGISTRER ──
function epinglerVideo(btn, id, card) {
    const box = btn.querySelector('.pin-box');
    const label = btn.querySelector('span:last-child');
    let epinglees = JSON.parse(localStorage.getItem('naihab_epinglees')) || [];
    const dejaEpinglee = epinglees.some(ep => ep.id === id);

    if (dejaEpinglee) {
        // Retirer des enregistrements
        epinglees = epinglees.filter(ep => ep.id !== id);
        localStorage.setItem('naihab_epinglees', JSON.stringify(epinglees));
        box.classList.remove('pin-active');
        if (label) label.innerText = 'Épingler';
        afficherToast('Retiré des enregistrements 📌');
        // Si c'était la vidéo "active" épinglée, on efface la mémorisation
        if (localStorage.getItem('naihab_video_epinglee') === id) {
            localStorage.removeItem('naihab_video_epinglee');
        }
    } else {
        // Ajouter aux enregistrements
        const auteur = card.dataset.auteur || '@Naïfan';
        const desc = card.dataset.desc || '';
        const emojis = ['🎬','🎵','🌅','😂','🔥','✨','👑','🎤'];
        const emoji = emojis[Math.floor(Math.random() * emojis.length)];
        epinglees.push({ id, auteur, desc, emoji });
        localStorage.setItem('naihab_epinglees', JSON.stringify(epinglees));
        box.classList.add('pin-active');
        if (label) label.innerText = 'Enregistré ✓';
        afficherToast('Enregistré ! 📌');
        // On mémorise que c'est la dernière vidéo épinglée, pour y revenir au prochain chargement
        localStorage.setItem('naihab_video_epinglee', id);
    }
    rafraichirTiroir();
}

// ── COMMENTAIRES ──
function allerCommentaires(id) {
    window.location.href = 'commentaires.html?index=' + id;
}

// ── PARTAGER ──
function partager() {
    const lien = encodeURIComponent('Regarde Naïhab ! 🎥👑\nhttps://mohamad577.github.io/naihab/MY%20APP/index.html');
    window.open('https://wa.me/?text=' + lien, '_blank');
}

// ── ALLER VERS VIDÉO PAR ID (depuis tiroir) ──
function allerVersVideoParId(id) {
    const container = document.getElementById('mainVideoContainer');
    const cards = Array.from(container.querySelectorAll('.video-card'));
    const index = cards.findIndex(c => c.dataset.id === id.toString());
    if (index >= 0) {
        container.scrollTo({ top: index * window.innerHeight, behavior: 'smooth' });
    }
}

// ── RESTAURER ÉTAT ÉPINGLÉES AU CHARGEMENT ──
function restaurerEpinglee() {
    // Réactiver l'icône 📌 sur toutes les vidéos enregistrées
    const epinglees = JSON.parse(localStorage.getItem('naihab_epinglees')) || [];
    epinglees.forEach(ep => {
        const card = document.querySelector(`.video-card[data-id="${ep.id}"]`);
        if (card) {
            const pinBox = card.querySelector('.pin-box');
            const pinLabel = card.querySelector('[data-action="epingler"] span:last-child');
            if (pinBox) pinBox.classList.add('pin-active');
            if (pinLabel) pinLabel.innerText = 'Enregistré ✓';
        }
    });

    // Revenir automatiquement sur la dernière vidéo épinglée
    const derniereEpinglee = localStorage.getItem('naihab_video_epinglee');
    if (derniereEpinglee) {
        const container = document.getElementById('mainVideoContainer');
        const cards = Array.from(container.querySelectorAll('.video-card'));
        const index = cards.findIndex(c => c.dataset.id === derniereEpinglee);
        if (index >= 0) {
            setTimeout(() => {
                container.scrollTo({ top: index * window.innerHeight, behavior: 'smooth' });
            }, 500);
        }
    }
}
function calculerGagnant() {
    // On regarde TOUTES les cartes vidéo affichées (démo + vidéos publiées),
    // pas seulement naihab_videos — sinon les votes sur les vidéos de démo
    // n'étaient jamais comptés pour désigner le gagnant.
    let maxVotes = 0, gagnant = null;
    document.querySelectorAll('.video-card').forEach(card => {
        const id = card.dataset.id;
        const votes = JSON.parse(localStorage.getItem('naihab_votes_' + id)) || [];
        if (votes.length > maxVotes) {
            maxVotes = votes.length;
            gagnant = {
                id,
                auteur: card.dataset.auteur || monNom,
                desc: card.dataset.desc || '',
                nbVotes: votes.length
            };
        }
    });
    if (gagnant) {
        localStorage.setItem('naihab_gagnant_couronne', JSON.stringify(gagnant));

        // CORRECTION : incrémenter le compteur de couronnes affiché sur profil.html
        // quand c'est TOI l'auteur de la vidéo en tête — une seule fois par vidéo
        // gagnante (pas à chaque recalcul après un vote), grâce à un repère de
        // la dernière vidéo déjà comptée.
        if (gagnant.auteur === monNom) {
            const derniereComptee = localStorage.getItem('naihab_derniere_couronne_comptee');
            if (derniereComptee !== gagnant.id) {
                const nbActuel = parseInt(localStorage.getItem('naihab_nb_couronnes') || '0');
                localStorage.setItem('naihab_nb_couronnes', nbActuel + 1);
                localStorage.setItem('naihab_derniere_couronne_comptee', gagnant.id);
            }
        }
    }
}

// ── TIROIR ──
function ouvrirTiroir() {
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawer-overlay').classList.add('open');
    document.getElementById('drawer-arrow').style.display = 'none';
}
function fermerTiroir() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawer-overlay').classList.remove('open');
    document.getElementById('drawer-arrow').style.display = 'flex';
}

// ── TOAST ──
function afficherToast(msg) {
    const t = document.getElementById('toast-global');
    t.innerText = msg; t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── FORMATER NOMBRE ──
function formaterNombre(n) {
    if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'k';
    return n.toString();
}
