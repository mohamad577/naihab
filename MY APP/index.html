<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Bienvenue</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a0b5a; /* Fond bleu nuit profond */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* Globe Three.js */
        #globe-canvas {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: -1;
            opacity: 0.85;
        }

        .top-bar {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            box-sizing: border-box;
        }

        .flag-img {
            width: 35px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .main-content {
            text-align: center;
            z-index: 10;
            margin-top: 50px;
        }

        h1 {
            font-size: 60px;
            margin: 0;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(#fff, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slogan {
            font-size: 18px;
            margin: 10px 0 40px 0;
            opacity: 0.9;
            font-weight: 300;
        }

        /* Boutons stylisés Naïhab */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 280px;
            padding: 16px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-create {
            background-color: #ffcc00;
            color: #311b92;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }

        .btn-login {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .footer {
            padding-bottom: 30px;
            font-size: 12px;
            text-align: center;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <canvas id="globe-canvas"></canvas>

    <div class="top-bar">
        <img id="flag" class="flag-img" src="https://flagcdn.com/w80/fr.png" alt="Drapeau">
    </div>

    <div class="main-content">
        <h1>Naïhab</h1>
        <p class="slogan">Ta zone, ton style, ta liberté !</p>

        <div class="btn-container">
            <a href="inscription.html" class="btn btn-create">Créer un compte</a>
            <a href="connexion.html" class="btn btn-login">Se connecter</a>
        </div>
    </div>

    <div class="footer">
        <div style="margin-bottom: 10px;">
            <span>Conditions</span> • <span>Politique</span> • <span>Aide</span>
        </div>
        <div>© 2026 Naïhab - Français</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ✅ Redirection vers splash si première visite
        if (!sessionStorage.getItem('splash_done')) {
            sessionStorage.setItem('splash_done', 'oui');
            window.location.href = 'splash.html';
        }

        // ✅ Globe Three.js 3D
        const canvas = document.getElementById('globe-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        const size = Math.min(window.innerWidth, 320);
        renderer.setSize(size, size);
        renderer.setPixelRatio(window.devicePixelRatio);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.z = 2.5;

        // Texture de la Terre
        const loader = new THREE.TextureLoader();
        const earthTexture = loader.load(
            'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg',
            undefined, undefined,
            () => {
                // Si ça échoue, on met une couleur de secours
                globeMesh.material.color.set(0x1a4a8a);
            }
        );

        // Globe
        const geometry = new THREE.SphereGeometry(1, 64, 64);
        const material = new THREE.MeshPhongMaterial({
            map: earthTexture,
            shininess: 15,
        });
        const globeMesh = new THREE.Mesh(geometry, material);
        scene.add(globeMesh);

        // Atmosphère brillante autour du globe
        const atmosGeo = new THREE.SphereGeometry(1.05, 64, 64);
        const atmosMat = new THREE.MeshPhongMaterial({
            color: 0x6644cc,
            transparent: true,
            opacity: 0.15,
            side: THREE.FrontSide,
        });
        scene.add(new THREE.Mesh(atmosGeo, atmosMat));

        // Lumières
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        const purpleLight = new THREE.PointLight(0x6633cc, 0.8, 10);
        purpleLight.position.set(-3, -2, 2);
        scene.add(purpleLight);

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            globeMesh.rotation.y += 0.003;
            renderer.render(scene, camera);
        }
        animate();

        // Détection auto du drapeau
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                const code = data.country_code.toLowerCase();
                document.getElementById('flag').src = `https://flagcdn.com/w80/${code}.png`;
            })
            .catch(() => {});
    </script>
</body>
</html>
