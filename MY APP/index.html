<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Bienvenue</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at top, #2a1570 0%, #1a0b5a 50%, #0d0535 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* Globe Three.js — plus grand */
        #globe-canvas {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        /* Halo violet sous le globe */
        .globe-halo {
            position: absolute;
            top: 220px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 80px;
            background: radial-gradient(ellipse, rgba(100,60,255,0.35) 0%, transparent 70%);
            z-index: 0;
            filter: blur(15px);
        }

        .top-bar {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            box-sizing: border-box;
            z-index: 10;
        }

        .flag-img {
            width: 38px;
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Contenu principal — en dessous du globe */
        .main-content {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            padding: 0 25px 35px;
            box-sizing: border-box;
            background: linear-gradient(to top, #1a0b5a 60%, transparent 100%);
        }

        h1 {
            font-size: 64px;
            margin: 0 0 8px 0;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #fff 0%, #ffcc00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(255,204,0,0.3));
        }

        .slogan {
            font-size: 16px;
            margin: 0 0 30px 0;
            opacity: 0.75;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
        }

        .btn-create {
            background: linear-gradient(135deg, #ffcc00, #ff9900);
            color: #1a0b5a;
            box-shadow: 0 6px 25px rgba(255, 204, 0, 0.4);
        }

        .btn-login {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
        }

        .btn:active { transform: scale(0.97); }

        .footer {
            position: absolute;
            bottom: 8px;
            font-size: 11px;
            text-align: center;
            opacity: 0.35;
            z-index: 10;
            width: 100%;
        }
    </style>
</head>
<body>

    <canvas id="globe-canvas"></canvas>
    <div class="globe-halo"></div>

    <div class="top-bar">
        <img id="flag" class="flag-img" src="https://flagcdn.com/w80/fr.png" alt="Drapeau">
    </div>

    <div class="main-content">
        <h1>Naïhab</h1>
        <p class="slogan">Ta zone, ton style, ta liberté !</p>

        <div class="btn-container">
            <a href="inscription.html" class="btn btn-create">Créer un compte</a>
            <a href="connexion.html" class="btn btn-login">Se connecter</a>
        </div>
    </div>

    <div class="footer">
        Conditions • Politique • Aide
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ✅ Si déjà connecté → rediriger directement
        if (localStorage.getItem('user_name') && localStorage.getItem('naihab_connecte')) {
            const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
            window.location.href = pageAccueil;
        }

        // ✅ Redirection vers splash si première visite
        if (!sessionStorage.getItem('splash_done')) {
            sessionStorage.setItem('splash_done', 'oui');
            window.location.href = 'splash.html';
        }

        // ✅ Globe Three.js 3D — plus grand
        const canvas = document.getElementById('globe-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        const size = Math.min(window.innerWidth * 1.1, 420);
        renderer.setSize(size, size);
        renderer.setPixelRatio(window.devicePixelRatio);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.z = 2.5;

        // Texture de la Terre
        const loader = new THREE.TextureLoader();
        const earthTexture = loader.load(
            'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg',
            undefined, undefined,
            () => {
                // Si ça échoue, on met une couleur de secours
                globeMesh.material.color.set(0x1a4a8a);
            }
        );

        // Globe
        const geometry = new THREE.SphereGeometry(1, 64, 64);
        const material = new THREE.MeshPhongMaterial({
            map: earthTexture,
            shininess: 15,
        });
        const globeMesh = new THREE.Mesh(geometry, material);
        scene.add(globeMesh);

        // Atmosphère brillante autour du globe
        const atmosGeo = new THREE.SphereGeometry(1.05, 64, 64);
        const atmosMat = new THREE.MeshPhongMaterial({
            color: 0x6644cc,
            transparent: true,
            opacity: 0.15,
            side: THREE.FrontSide,
        });
        scene.add(new THREE.Mesh(atmosGeo, atmosMat));

        // Lumières
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        const purpleLight = new THREE.PointLight(0x6633cc, 0.8, 10);
        purpleLight.position.set(-3, -2, 2);
        scene.add(purpleLight);

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            globeMesh.rotation.y += 0.003;
            renderer.render(scene, camera);
        }
        animate();

        // Détection auto du drapeau
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                const code = data.country_code.toLowerCase();
                document.getElementById('flag').src = `https://flagcdn.com/w80/${code}.png`;
            })
            .catch(() => {});
    </script>
</body>
</html>
