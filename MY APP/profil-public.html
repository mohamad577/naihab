<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Profil Naïfan</title>
    <style>
        :root { --bg-deep:#1a0b5a; --gold:#ffcc00; --glass:rgba(255,255,255,0.05); }
        body { margin:0; background-color:var(--bg-deep); color:white; font-family:'Segoe UI',sans-serif; padding-bottom:90px; overflow-x:hidden; }
        .header-top { display:flex; justify-content:space-between; align-items:center; padding:20px; position:sticky; top:0; z-index:10; background:rgba(26,11,90,0.85); backdrop-filter:blur(10px); }
        .back-btn { font-size:24px; color:var(--gold); font-weight:bold; cursor:pointer; background:none; border:none; }
        .profile-content { text-align:center; padding:0 25px; }
        .photo-container { width:115px; height:115px; border-radius:50%; border:3px solid var(--gold); margin:10px auto 15px; overflow:hidden; background:#0d124a; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
        #photo-naifan { width:100%; height:100%; object-fit:cover; }
        .nom-affichage { font-size:24px; font-weight:900; margin:5px 0; letter-spacing:-0.5px; }
        .stats { display:flex; justify-content:space-around; margin:25px 0; background:var(--glass); padding:15px; border-radius:20px; border:1px solid rgba(255,255,255,0.03); }
        .stat-item { text-align:center; font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:0.7; }
        .stat-item b { font-size:18px; display:block; color:white; margin-bottom:2px; }
        .actions-naifan { display:flex; gap:10px; margin-bottom:30px; }
        .btn-suivre { flex:2; background:var(--gold); color:var(--bg-deep); border:none; padding:14px 0; border-radius:15px; font-weight:800; font-size:14px; cursor:pointer; transition:0.3s; }
        .btn-suivre.active { background:rgba(255,255,255,0.1); color:white; border:1px solid rgba(255,255,255,0.2); }
        .btn-message { flex:1; background:var(--glass); color:white; border:1px solid rgba(255,255,255,0.1); padding:14px 0; border-radius:15px; font-weight:800; font-size:18px; cursor:pointer; display:flex; justify-content:center; align-items:center; }
        .profile-tabs { display:flex; border-top:1px solid rgba(255,255,255,0.05); background:rgba(0,0,0,0.1); }
        .tab { flex:1; padding:15px; text-align:center; opacity:0.4; border-bottom:2px solid transparent; font-size:12px; font-weight:800; cursor:pointer; transition:0.3s; }
        .tab.active { opacity:1; border-bottom:2px solid var(--gold); color:var(--gold); }
        .profile-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px; }
        .grid-item { position:relative; width:100%; padding-top:100%; background:#0d124a; cursor:pointer; overflow:hidden; }
        .grid-item img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transition:0.3s; }
        .grid-item:active img { transform:scale(0.95); opacity:0.8; }
        #menuOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; }
        #menuOptions { position:absolute; bottom:0; width:100%; background:#0d124a; border-radius:25px 25px 0 0; padding:20px; box-sizing:border-box; transform:translateY(100%); transition:0.3s; }
        .menu-item { padding:15px; font-weight:bold; border-bottom:1px solid rgba(255,255,255,0.05); cursor:pointer; }
        .nav-bas { position:fixed; bottom:0; left:0; width:100%; height:75px; background:#0d124a; display:flex; justify-content:space-around; align-items:center; z-index:100; border-top:1px solid rgba(255,255,255,0.05); }
        .nav-link { text-decoration:none; font-size:24px; color:white; opacity:0.4; }
    </style>
</head>
<body>

    <div class="header-top">
        <button class="back-btn" onclick="window.history.back()">⇠</button>
        <b id="username-title" style="font-size:15px; opacity:0.9;">Profil</b>
        <span style="font-size:24px; cursor:pointer;" onclick="ouvrirMenu()">⋮</span>
    </div>

    <div class="profile-content">
        <div class="photo-container">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400" id="photo-naifan" alt="Photo profil">
        </div>
        <div class="nom-affichage" id="nom-naifan">Utilisateur 👑</div>
        <p style="opacity:0.6; font-size:13px; margin:8px 0 20px; line-height:1.4;" id="bio-naifan">
            Vainqueur de session 👑 <br> Fier Naïfan de la communauté.
        </p>
        <div class="stats">
            <div class="stat-item"><b id="stat-posts">45</b>Posts</div>
            <div class="stat-item"><b id="stat-naifans">1.2k</b>Naïfans</div>
            <div class="stat-item"><b id="stat-couronnes">1</b>👑</div>
        </div>
        <div class="actions-naifan">
            <button class="btn-suivre" id="btn-suivre" onclick="toggleSuivre(this)">SUIVRE</button>
            <button class="btn-message" onclick="envoyerVersMessage()">✉️</button>
        </div>
    </div>

    <div class="profile-tabs">
        <div class="tab active" id="tab-posts" onclick="basculerTab('posts')">📱 POSTS</div>
        <div class="tab" id="tab-aimes" onclick="basculerTab('aimes')">❤️ AIMÉS</div>
    </div>

    <div class="profile-grid" id="grille-posts">
        <div class="grid-item" onclick="ouvrirPublication(0)"><img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400" alt="Post"></div>
        <div class="grid-item" onclick="ouvrirPublication(1)"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400" alt="Post"></div>
        <div class="grid-item" onclick="ouvrirPublication(2)"><img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=400" alt="Post"></div>
    </div>

    <div id="grille-aimes" style="display:none; padding:40px 20px; text-align:center; opacity:0.4;">
        <div style="font-size:40px; margin-bottom:10px;">❤️</div>
        <p>Aucune publication aimée pour l'instant.</p>
    </div>

    <div id="menuOverlay" onclick="fermerMenu()">
        <div id="menuOptions">
            <div style="width:40px; height:5px; background:rgba(255,255,255,0.2); border-radius:10px; margin:0 auto 20px auto;"></div>
            <div class="menu-item" onclick="partagerProfil()">✈️ Partager le profil</div>
            <div class="menu-item" onclick="bloquerUtilisateur()">🚫 Bloquer l'utilisateur</div>
            <div class="menu-item" onclick="signalerCompte()" style="color:#ff4757;">🚨 Signaler ce compte</div>
            <button onclick="fermerMenu()" style="width:100%; margin-top:15px; padding:15px; border-radius:15px; border:none; background:rgba(255,255,255,0.1); color:white; font-weight:bold; cursor:pointer;">Annuler</button>
        </div>
    </div>

    <nav class="nav-bas">
        <a href="chats.html" class="nav-link">🏠</a>
        <a href="recherche.html" class="nav-link">🔍</a>
        <a href="videos.html" class="nav-link">▶️</a>
        <a href="notifications.html" class="nav-link">🔔</a>
        <a href="profil.html" class="nav-link">👤</a>
    </nav>

<script>
    const postsDemo = [
        { image:'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400', texte:'💻 Nouvelle journée de code !', likes:45, commentaires:8 },
        { image:'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400', texte:'🌅 Vue magnifique ce matin', likes:120, commentaires:15 },
        { image:'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=400', texte:'🎯 Focus total aujourd\'hui', likes:67, commentaires:5 }
    ];

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const nomRecu = urlParams.get('name');
        const imgRecue = urlParams.get('img');

        if (nomRecu) {
            // CORRECTION : replace() sans flag global ne remplace que le premier underscore
            // Utiliser une regex /g pour remplacer TOUS les underscores
            const nomPropre = nomRecu.replace(/_/g, ' ');
            document.getElementById('nom-naifan').innerText = nomPropre + " 👑";
            document.getElementById('username-title').innerText = "@" + nomRecu;
        }
        if (imgRecue) document.getElementById('photo-naifan').src = imgRecue;

        // Restaurer état suivre
        const nomCle = (nomRecu || 'inconnu').toLowerCase();
        if (localStorage.getItem('naihab_suit_' + nomCle) === '1') {
            const btn = document.getElementById('btn-suivre');
            btn.innerText = "SUIVI ✓";
            btn.classList.add('active');
        }
    };

    function basculerTab(tab) {
        document.getElementById('tab-posts').classList.toggle('active', tab === 'posts');
        document.getElementById('tab-aimes').classList.toggle('active', tab === 'aimes');
        document.getElementById('grille-posts').style.display = tab === 'posts' ? 'grid' : 'none';
        document.getElementById('grille-aimes').style.display = tab === 'aimes' ? 'block' : 'none';
    }

    function ouvrirPublication(index) {
        const nom = document.getElementById('nom-naifan').innerText;
        const photo = document.getElementById('photo-naifan').src;
        const post = postsDemo[index];
        localStorage.setItem('naihab_publication_demo', JSON.stringify({
            image: post.image, texte: post.texte, likes: post.likes,
            commentaires: post.commentaires, auteur: nom, auteurPhoto: photo, date: "aujourd'hui"
        }));
        window.location.href = 'publication.html?demo=1';
    }

    function envoyerVersMessage() {
        const nom = document.getElementById('nom-naifan').innerText.replace(' 👑', '');
        const photo = document.getElementById('photo-naifan').src;
        localStorage.setItem('naihab_contact_actif', nom);
        localStorage.setItem('naihab_contact_avatar', photo);
        window.location.href = 'message-prive.html';
    }

    function toggleSuivre(btn) {
        const nomRecu = new URLSearchParams(window.location.search).get('name') || 'inconnu';
        const cle = 'naihab_suit_' + nomRecu.toLowerCase();
        if (btn.innerText.includes('SUIVRE') && !btn.innerText.includes('✓')) {
            btn.innerText = "SUIVI ✓";
            btn.classList.add('active');
            localStorage.setItem(cle, '1');
        } else {
            btn.innerText = "SUIVRE";
            btn.classList.remove('active');
            localStorage.removeItem(cle);
        }
    }

    function ouvrirMenu() {
        document.getElementById('menuOverlay').style.display = 'block';
        setTimeout(() => { document.getElementById('menuOptions').style.transform = 'translateY(0)'; }, 10);
    }

    function fermerMenu() {
        document.getElementById('menuOptions').style.transform = 'translateY(100%)';
        setTimeout(() => { document.getElementById('menuOverlay').style.display = 'none'; }, 300);
    }

    function partagerProfil() {
        const nom = document.getElementById('nom-naifan').innerText;
        const lien = window.location.href;
        if (navigator.share) {
            navigator.share({ title: nom + ' sur Naïhab', url: lien });
        } else {
            navigator.clipboard && navigator.clipboard.writeText(lien);
            alert('Lien du profil copié !');
        }
        fermerMenu();
    }

    function bloquerUtilisateur() {
        if (confirm("Bloquer cet utilisateur ?")) { alert("Utilisateur bloqué."); fermerMenu(); }
    }

    function signalerCompte() {
        alert("Merci pour ton signalement. Nous allons examiner ce compte.");
        fermerMenu();
    }
</script>
</body>
</html>
