<!DOCTYPE html>
<html lang="fr">
<head>
    <script type="module" src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Créer un Post</title>
    <style>
        :root {
            --bg-deep: #1a0b5a;
            --gold: #ffcc00;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body { 
            margin: 0; 
            background-color: var(--bg-deep); 
            font-family: 'Segoe UI', sans-serif; 
            color: white; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
        }

        .annuler { 
            cursor: pointer; 
            opacity: 0.7; 
            font-weight: 500;
            font-size: 16px;
        }

        .publier-btn { 
            background: var(--gold); 
            border: none; 
            padding: 10px 25px; 
            border-radius: 25px; 
            color: var(--bg-deep); 
            font-weight: 800; 
            cursor: pointer; 
            opacity: 0.3; 
            transition: 0.3s;
            pointer-events: none;
            text-transform: uppercase;
            font-size: 13px;
            position: relative;
            overflow: hidden;
        }

        .active-btn { 
            opacity: 1 !important; 
            pointer-events: auto;
            box-shadow: 0 5px 15px rgba(255, 204, 0, 0.3); 
        }

        .publier-btn.loading {
            color: transparent;
            pointer-events: none;
        }

        .publier-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 18px; height: 18px;
            margin: -9px 0 0 -9px;
            border: 3px solid rgba(26,11,90,0.2);
            border-top-color: var(--bg-deep);
            border-radius: 50%;
            animation: tourner 0.7s linear infinite;
        }

        @keyframes tourner {
            to { transform: rotate(360deg); }
        }

        .post-input { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: white; 
            font-size: 18px; 
            outline: none; 
            resize: none; 
            margin-top: 10px; 
            flex-grow: 1;
            min-height: 100px;
        }

        #preview-container { 
            width: 100%; 
            margin: 20px 0; 
            display: none; 
            border-radius: 20px; 
            overflow: hidden; 
            background: black; 
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #preview-img, #preview-video { 
            width: 100%; 
            max-height: 350px; 
            object-fit: contain; 
            display: block;
        }

        .options { 
            border-top: 1px solid rgba(255,255,255,0.05); 
            padding: 20px 0; 
            display: flex; 
            gap: 15px; 
        }

        .opt-item { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            cursor: pointer; 
            font-size: 14px; 
            background: var(--glass); 
            padding: 12px 20px; 
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.2s;
        }

        .opt-item:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        
        .opt-item span { font-size: 18px; }

        #input-photo, #input-video { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <span class="annuler" onclick="window.history.back()">Annuler</span>
        <button class="publier-btn" id="btnPublier" onclick="publierMedia()">Publier</button>
    </div>

    <textarea class="post-input" id="postText" placeholder="Partagez quelque chose avec vos Naïfans..." oninput="verifierContenu()"></textarea>

    <div id="preview-container">
        <img id="preview-img" style="display:none">
        <video id="preview-video" controls style="display:none"></video>
    </div>

    <div class="options">
        <label for="input-photo" class="opt-item"><span>📷</span> Photo</label>
        <input type="file" id="input-photo" accept="image/*" onchange="aperçuMedia(this, 'image')">

        <label for="input-video" class="opt-item"><span>🎥</span> Vidéo</label>
        <input type="file" id="input-video" accept="video/*" onchange="aperçuMedia(this, 'video')">
    </div>

    <script type="module">
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import { auth, db } from './firebase-config.js';

        let mediaSelectionne = false;
        let fichierData = ""; 
        let typeFichier = "";

        window.aperçuMedia = function(input, type) {
            const container = document.getElementById('preview-container');
            const img = document.getElementById('preview-img');
            const video = document.getElementById('preview-video');
            
            if (input.files && input.files[0]) {
                const fichier = input.files[0];

                if (type === 'video') {
                    // Vidéos : toujours en base64/localStorage pour l'instant.
                    // Passage à Firebase Storage prévu plus tard (les vidéos
                    // dépassent souvent la limite de 1 Mo par document Firestore).
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        container.style.display = 'block';
                        fichierData = e.target.result;
                        typeFichier = 'video';
                        video.src = fichierData;
                        video.style.display = 'block';
                        img.style.display = 'none';
                        mediaSelectionne = true;
                        verifierContenu();
                    };
                    reader.readAsDataURL(fichier);
                } else {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        container.style.display = 'block';
                        fichierData = e.target.result;
                        typeFichier = 'image';
                        img.src = fichierData;
                        img.style.display = 'block';
                        video.style.display = 'none';
                        mediaSelectionne = true;
                        verifierContenu();
                    };
                    reader.readAsDataURL(fichier);
                }
            }
        };

        window.verifierContenu = function() {
            const text = document.getElementById('postText').value.trim();
            const btn = document.getElementById('btnPublier');
            
            if (text.length > 0 || mediaSelectionne) {
                btn.classList.add('active-btn');
            } else {
                btn.classList.remove('active-btn');
            }
        };

        window.publierMedia = async function() {
            const text = document.getElementById('postText').value.trim();
            const btn = document.getElementById('btnPublier');

            if (!auth.currentUser) {
                alert("Tu dois être connecté pour publier !");
                return;
            }

            if (typeFichier === 'video') {
                // Vidéo : comportement inchangé pour l'instant (localStorage)
                const userName = localStorage.getItem("user_name") || "Naïfan";
                let mesVideos = JSON.parse(localStorage.getItem('naihab_videos')) || [];
                mesVideos.unshift({
                    id: Date.now(),
                    url: fichierData,
                    titre: text,
                    auteur: userName,
                    date: new Date().toLocaleDateString()
                });
                try {
                    localStorage.setItem('naihab_videos', JSON.stringify(mesVideos));
                    window.location.href = 'videos.html?nouveau=1';
                } catch (e) {
                    alert("La vidéo est trop lourde pour être enregistrée sur cet appareil. Essaie une vidéo plus courte ou de moins bonne qualité.");
                }
                return;
            }

            // Photo (ou texte seul) : publication réelle sur Firestore,
            // visible par tous les comptes Naïhab
            btn.classList.add('loading');
            try {
                await addDoc(collection(db, 'publications'), {
                    uid: auth.currentUser.uid,
                    nom: auth.currentUser.displayName || localStorage.getItem('user_name') || 'Naïfan',
                    photoAuteur: localStorage.getItem('user_photo') || auth.currentUser.photoURL || '',
                    texte: text,
                    image: fichierData || '',
                    date: serverTimestamp(),
                    likes: 0,
                    commentaires: 0
                });
                alert(`Ton post est en ligne ! 👑`);
                window.location.href = 'chats.html';
            } catch (err) {
                btn.classList.remove('loading');
                console.error('Erreur publication Naïhab :', err);
                alert("Une erreur est survenue lors de la publication. Réessaie.");
            }
        };
    </script>
</body>
</html>
