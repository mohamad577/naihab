<!DOCTYPE html>
<html lang="fr">
<head>
    <script type="module" src="firebase-config.js"></script>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Inscription</title>
    <style>
        body {
            margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif;
            background-color: #1a0b5a; color: white;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            justify-content: center;
        }

        h2 { font-weight: 900; margin-bottom: 10px; }
        p.sous-titre { opacity: 0.75; font-size: 14px; text-align: center; max-width: 300px; margin-bottom: 35px; }

        /* Photo de profil cliquable */
        .profile-pic-container { position: relative; margin-bottom: 25px; cursor: pointer; }
        .profile-pic {
            width: 110px; height: 110px; background-color: rgba(255, 255, 255, 0.1);
            border: 3px solid #ffcc00; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
        }
        #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .camera-icon {
            position: absolute; bottom: 5px; right: 5px; background: #ffcc00;
            padding: 8px; border-radius: 50%; width: 20px; height: 20px;
            display: flex; justify-content: center; align-items: center;
        }

        .form-group { width: 100%; max-width: 350px; margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 12px; color: #ffcc00; text-transform: uppercase; }

        input {
            width: 100%; padding: 15px; border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; background-color: rgba(255, 255, 255, 0.05);
            color: white; font-size: 16px; box-sizing: border-box; outline: none;
        }

        .btn-register {
            width: 100%; max-width: 350px; padding: 18px; background-color: #ffcc00;
            color: #1a0b5a; border: none; border-radius: 30px; font-weight: bold;
            margin-top: 10px; cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            position: relative; overflow: hidden; transition: 0.3s;
        }

        .btn-register.loading {
            background: rgba(255,204,0,0.3);
            color: transparent;
            pointer-events: none;
        }

        .btn-register.loading::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 24px; height: 24px;
            margin: -12px 0 0 -12px;
            border: 3px solid rgba(255,204,0,0.3);
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: tourner 0.7s linear infinite;
        }

        @keyframes tourner {
            to { transform: rotate(360deg); }
        }

        /* Bouton Google */
        .btn-google {
            width: 100%; max-width: 350px; padding: 16px;
            background: white; color: #333; border: none; border-radius: 30px;
            font-weight: bold; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .suite-formulaire { display: none; width: 100%; flex-direction: column; align-items: center; margin-top: 30px; }

        .link-text {
            margin-top: 25px;
            font-size: 14px;
            color: #ffcc00;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Rejoindre Naïhab</h2>
    <p class="sous-titre">Dans l'univers de Naïhab, tu es libre. Connecte-toi avec Google pour commencer, en toute sécurité.</p>

    <div id="etape-google" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <button class="btn-google" onclick="seConnecterGoogle()">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.72c-.18-.54-.28-1.12-.28-1.72s.1-1.18.28-1.72V4.94H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.06l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
            Continuer avec Google
        </button>
    </div>

    <!-- Étape 2 : révélée après connexion Google -->
    <div class="suite-formulaire" id="suite-formulaire">

        <div class="profile-pic-container" onclick="document.getElementById('file-input').click()">
            <div class="profile-pic" id="profile-display">
                <img id="preview-img" src="" alt="Aperçu">
                <svg id="default-icon" width="50" height="50" viewBox="0 0 24 24" fill="rgba(255,255,255,0.3)">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <div class="camera-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="#1a0b5a"><path d="M9 3L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2h-3.17L15 3H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            </div>
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="loadPhoto(event)">
        </div>

        <div class="form-group">
            <label>Nom complet</label>
            <input type="text" id="champ-nom" placeholder="Ex: Jackson Junior">
        </div>

        <button class="btn-register" onclick="terminerInscription()">TERMINER L'INSCRIPTION</button>
    </div>

    <div class="link-text" onclick="window.location.href='connexion.html'">Déjà un compte ? Se connecter</div>

    <script type="module">
        import {
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { auth } from './firebase-config.js';

        // ✅ Si déjà connecté → rediriger directement
        if (localStorage.getItem('user_name') && localStorage.getItem('naihab_connecte')) {
            const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
            window.location.href = pageAccueil;
        }

        window.loadPhoto = function(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('preview-img');
                const defaultIcon = document.getElementById('default-icon');
                output.src = reader.result;
                output.style.display = 'block';
                defaultIcon.style.display = 'none';
                localStorage.setItem("user_photo", reader.result);
            };
            reader.readAsDataURL(event.target.files[0]);
        };

        function traduireErreur(code) {
            switch (code) {
                case 'auth/popup-closed-by-user':
                    return "Fenêtre Google fermée avant la fin. Réessaie.";
                case 'auth/network-request-failed':
                    return "Problème de connexion internet. Réessaie.";
                default:
                    return "Une erreur est survenue. Réessaie.";
            }
        }

        function revelerSuiteFormulaire(user) {
            document.getElementById('etape-google').style.display = 'none';
            document.getElementById('suite-formulaire').style.display = 'flex';
            document.getElementById('champ-nom').value = user.displayName || '';

            if (user.photoURL) {
                const output = document.getElementById('preview-img');
                const defaultIcon = document.getElementById('default-icon');
                output.src = user.photoURL;
                output.style.display = 'block';
                defaultIcon.style.display = 'none';
            }
        }

        window.seConnecterGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                // On repart toujours d'une session propre pour éviter toute confusion
                // avec un compte précédemment utilisé sur cet appareil
                await signOut(auth);
                const result = await signInWithPopup(auth, provider);
                revelerSuiteFormulaire(result.user);
            } catch (err) {
                alert(traduireErreur(err.code));
            }
        };

        window.terminerInscription = async function() {
            if (!auth.currentUser) {
                alert("Connecte-toi d'abord avec Google !");
                return;
            }

            const nom = document.getElementById('champ-nom').value.trim();
            const btn = document.querySelector('.btn-register');

            if (nom === "") { alert("Entre ton nom complet !"); return; }

            btn.classList.add('loading');

            try {
                if (nom !== auth.currentUser.displayName) {
                    await updateProfile(auth.currentUser, { displayName: nom });
                }

                localStorage.setItem("user_name", nom);
                localStorage.setItem("user_email", auth.currentUser.email);
                localStorage.setItem('naihab_nouveau_compte', 'oui');
                localStorage.setItem('naihab_connecte', 'oui');
                localStorage.setItem('naihab_uid', auth.currentUser.uid);

                const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
                window.location.href = pageAccueil;
            } catch (err) {
                btn.classList.remove('loading');
                alert(traduireErreur(err.code));
            }
        };
    </script>

</body>
</html>
