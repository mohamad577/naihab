<!DOCTYPE html>
<html lang="fr">
<head>
    <script type="module" src="auth-guard.js"></script>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Publication</title>
    <style>
        :root { --bg-deep: #1a0b5a; --gold: #ffcc00; --heart: #ff4757; }
        body { margin:0; background-color:var(--bg-deep); font-family:'Segoe UI',sans-serif; color:white; overflow-x:hidden; }
        .header { padding:15px 20px; display:flex; align-items:center; gap:20px; background:rgba(26,11,90,0.8); backdrop-filter:blur(10px); position:sticky; top:0; z-index:100; }
        .back-btn { text-decoration:none; font-size:20px; color:var(--gold); font-weight:bold; cursor:pointer; background:none; border:none; }
        .header h3 { font-size:17px; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin:0; }
        .container { max-width:500px; margin:0 auto; background:rgba(0,0,0,0.2); min-height:100vh; }
        .author-box { padding:15px 20px; display:flex; align-items:center; justify-content:space-between; }
        .author-info { display:flex; align-items:center; gap:12px; }
        .author-img { width:40px; height:40px; border-radius:50%; border:2px solid var(--gold); object-fit:cover; }
        .author-name { font-weight:700; font-size:15px; }
        .more-options { opacity:0.5; font-size:20px; cursor:pointer; padding:5px; }
        .main-img-container { width:100%; background:#000; line-height:0; }
        .main-img { width:100%; height:auto; max-height:80vh; object-fit:contain; }
        .actions { padding:20px; }
        .btns { display:flex; gap:20px; margin-bottom:15px; align-items:center; }
        .btn-item { cursor:pointer; font-size:26px; transition:0.2s cubic-bezier(0.175,0.885,0.32,1.275); }
        .btn-item:active { transform:scale(1.3); }
        .stats { font-size:14px; font-weight:800; margin-bottom:8px; }
        .caption { font-size:14px; line-height:1.5; opacity:0.9; }
        .caption b { color:var(--gold); margin-right:5px; }
        .date-post { font-size:10px; text-transform:uppercase; opacity:0.4; margin-top:15px; letter-spacing:1px; }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="window.history.back()">←</button>
        <h3>Publication</h3>
    </div>

    <div class="container">
        <div class="author-box">
            <div class="author-info">
                <img id="author-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="author-img" alt="Auteur">
                <div class="author-name" id="author-name">Naïfan</div>
            </div>
            <div class="more-options" onclick="ouvrirMenu()">•••</div>
        </div>

        <!-- Menu ••• -->
        <div id="menu-overlay" onclick="fermerMenu()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000;">
            <div onclick="event.stopPropagation()" style="position:absolute; bottom:0; width:100%; background:#0d124a; border-radius:25px 25px 0 0; padding:20px; box-sizing:border-box;">
                <div style="width:40px; height:5px; background:rgba(255,255,255,0.2); border-radius:10px; margin:0 auto 20px auto;"></div>
                <div onclick="partagerPublication()" style="padding:15px; font-weight:bold; border-bottom:1px solid rgba(255,255,255,0.05); cursor:pointer;">✈️ Partager cette publication</div>
                <div onclick="copierLien()" style="padding:15px; font-weight:bold; border-bottom:1px solid rgba(255,255,255,0.05); cursor:pointer;">🔗 Copier le lien</div>
                <div id="option-supprimer" onclick="supprimerPublication()" style="display:none; padding:15px; font-weight:bold; color:#ff5252; border-bottom:1px solid rgba(255,255,255,0.05); cursor:pointer;">🗑️ Supprimer cette publication</div>
                <button onclick="fermerMenu()" style="width:100%; margin-top:15px; padding:15px; border-radius:15px; border:none; background:rgba(255,255,255,0.1); color:white; font-weight:bold; cursor:pointer;">Annuler</button>
            </div>
        </div>

        <div class="main-img-container">
            <img id="main-img" src="" class="main-img" alt="Publication">
        </div>

        <div class="actions">
            <div class="btns">
                <div class="btn-item" onclick="toggleLike(this)">
                    <span class="heart">🤍</span>
                </div>
                <div class="btn-item" onclick="allerCommentaires()" style="cursor: pointer;">
                    <span>💬</span>
                </div>
                <div class="btn-item" onclick="partagerPublication()">
                    <span>✈️</span>
                </div>
            </div>

            <div class="stats"><span id="nb-likes">0</span> J'aime • <span id="nb-commentaires">0</span> Commentaires</div>
            <div class="caption"><b id="caption-nom">Naïfan</b><span id="caption-texte"></span></div>
            <div class="date-post" id="date-post">Naïhab</div>
        </div>
    </div>

<script type="module">
    import { doc, getDoc, updateDoc, deleteDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { auth, db } from './firebase-config.js';

    let postIndex = 0;
    let isDemo = false;
    let demoId = '';
    let realId = null; // id Firestore si c'est une vraie publication
    let auteurUid = null; // uid de l'auteur de la publication réelle en cours

    function mesLikesLocaux() {
        return JSON.parse(localStorage.getItem('naihab_mes_likes')) || [];
    }

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);

        // Mode Démo (Julie, ou une des publications de la grille recherche.html)
        if (urlParams.get('demo') === '1') {
            isDemo = true;
            demoId = urlParams.get('id') || '';
            const cleDemo = demoId ? ('naihab_publication_demo_' + demoId) : 'naihab_publication_demo';
            const demo = JSON.parse(localStorage.getItem(cleDemo));
            if (demo) {
                document.getElementById('main-img').src = demo.image;
                document.getElementById('caption-texte').innerText = demo.texte || '';
                document.getElementById('date-post').innerText = "Publié il y a " + (demo.date || "2h") + " • Naïhab";
                document.getElementById('nb-likes').innerText = demo.likes || 0;
                document.getElementById('author-name').innerText = demo.auteur;
                document.getElementById('caption-nom').innerText = demo.auteur;
                if (demo.auteurPhoto) document.getElementById('author-img').src = demo.auteurPhoto;

                const cleComms = demoId ? ('naihab_commentaires_demo_' + demoId) : 'naihab_commentaires_demo';
                const commsDemo = JSON.parse(localStorage.getItem(cleComms)) || [];
                document.getElementById('nb-commentaires').innerText = commsDemo.length;
            }
            return;
        }

        // Vraie publication Firestore (venant de chats.html : ?id=xxxxx)
        const idParam = urlParams.get('id');
        if (idParam) {
            realId = idParam;
            chargerPublicationReelle(realId);
            return;
        }

        // Ancien système local (posts créés avant la migration Firestore)
        postIndex = parseInt(urlParams.get('index')) || 0;
        const nomSauve = localStorage.getItem("user_name") || "Moi";
        const photoSauve = localStorage.getItem("user_photo") || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

        const mesPosts = JSON.parse(localStorage.getItem('naihab_posts')) || [];

        if (mesPosts.length > 0 && mesPosts[postIndex]) {
            const post = mesPosts[postIndex];
            document.getElementById('main-img').src = post.image;
            document.getElementById('caption-texte').innerText = post.texte || '';
            document.getElementById('date-post').innerText = "Publié récemment • Naïhab";
            document.getElementById('nb-likes').innerText = post.likes || 0;
            if (post.liked) document.querySelector('.heart').innerText = '❤️';
        }

        document.getElementById('author-name').innerText = nomSauve;
        document.getElementById('caption-nom').innerText = nomSauve;
        document.getElementById('author-img').src = photoSauve;

        const commentaires = JSON.parse(localStorage.getItem('naihab_commentaires_' + postIndex)) || [];
        document.getElementById('nb-commentaires').innerText = commentaires.length;
    };

    function chargerPublicationReelle(id) {
        const postRef = doc(db, 'publications', id);

        // onSnapshot pour que les likes/commentaires se mettent à jour en direct
        onSnapshot(postRef, (docSnap) => {
            if (!docSnap.exists()) {
                document.getElementById('caption-texte').innerText = "Cette publication n'existe plus.";
                return;
            }
            const post = docSnap.data();
            auteurUid = post.uid || null;
            document.getElementById('main-img').src = post.image || '';
            document.getElementById('caption-texte').innerText = post.texte || '';
            document.getElementById('caption-nom').innerText = post.nom || 'Naïfan';
            document.getElementById('author-name').innerText = post.nom || 'Naïfan';
            document.getElementById('author-img').src = post.photoAuteur || 'logo_naihab.svg';
            document.getElementById('nb-likes').innerText = post.likes || 0;
            document.getElementById('nb-commentaires').innerText = post.commentaires || 0;
            document.getElementById('date-post').innerText = "Naïhab";

            if (auth.currentUser && auteurUid === auth.currentUser.uid) {
                document.getElementById('option-supprimer').style.display = 'block';
            } else {
                document.getElementById('option-supprimer').style.display = 'none';
            }

            const mesLikes = mesLikesLocaux();
            document.querySelector('.heart').innerText = mesLikes.includes(id) ? '❤️' : '🤍';
        });
    }

    window.toggleLike = async function(element) {
        const heart = element.querySelector('.heart');
        const affichageLikes = document.getElementById('nb-likes');
        let nombreActuel = parseInt(affichageLikes.innerText) || 0;

        if (isDemo) {
            if (heart.innerText === '🤍') {
                heart.innerText = '❤️';
                nombreActuel++;
            } else {
                heart.innerText = '🤍';
                nombreActuel = Math.max(0, nombreActuel - 1);
            }
            affichageLikes.innerText = nombreActuel;
            return;
        }

        if (realId) {
            // Vraie publication Firestore : like partagé par tous les comptes
            const postRef = doc(db, 'publications', realId);
            let mesLikes = mesLikesLocaux();
            if (heart.innerText === '🤍') {
                heart.innerText = '❤️';
                mesLikes.push(realId);
                await updateDoc(postRef, { likes: increment(1) });
            } else {
                heart.innerText = '🤍';
                mesLikes = mesLikes.filter(id => id !== realId);
                await updateDoc(postRef, { likes: increment(-1) });
            }
            localStorage.setItem('naihab_mes_likes', JSON.stringify(mesLikes));
            heart.animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}], {duration:300});
            return;
        }

        // Ancien système local
        let mesPosts = JSON.parse(localStorage.getItem('naihab_posts')) || [];
        if (heart.innerText === '🤍') {
            heart.innerText = '❤️';
            nombreActuel++;
            if (mesPosts[postIndex]) { mesPosts[postIndex].likes = nombreActuel; mesPosts[postIndex].liked = true; }
            heart.animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}], {duration:300});
        } else {
            heart.innerText = '🤍';
            nombreActuel = Math.max(0, nombreActuel - 1);
            if (mesPosts[postIndex]) { mesPosts[postIndex].likes = nombreActuel; mesPosts[postIndex].liked = false; }
        }
        affichageLikes.innerText = nombreActuel;
        localStorage.setItem('naihab_posts', JSON.stringify(mesPosts));
    };

    window.allerCommentaires = function() {
        if (isDemo) {
            window.location.href = 'commentaires.html?demo=1' + (demoId ? '&id=' + demoId : '');
        } else if (realId) {
            window.location.href = 'commentaires.html?id=' + realId;
        } else {
            window.location.href = 'commentaires.html?index=' + postIndex;
        }
    };

    window.ouvrirMenu = function() { document.getElementById('menu-overlay').style.display = 'block'; };
    window.fermerMenu = function() { document.getElementById('menu-overlay').style.display = 'none'; };

    window.partagerPublication = function() {
        const lien = "https://mohamad577.github.io/naihab/MY%20APP/index.html";
        const message = "Regarde cette publication sur Naïhab ! ✨ " + lien;
        window.open("https://wa.me/?text=" + encodeURIComponent(message), '_blank');
        fermerMenu();
    };

    window.supprimerPublication = async function() {
        if (!realId || !auth.currentUser || auteurUid !== auth.currentUser.uid) return;
        if (!confirm("Supprimer définitivement cette publication ?")) return;

        try {
            await deleteDoc(doc(db, 'publications', realId));
            fermerMenu();
            window.location.href = 'chats.html';
        } catch (err) {
            console.error('Erreur suppression Naïhab :', err);
            alert("Une erreur est survenue. Réessaie.");
        }
    };

    window.copierLien = function() {
        const lien = "https://mohamad577.github.io/naihab/MY%20APP/index.html";
        if (navigator.clipboard) {
            navigator.clipboard.writeText(lien).then(() => afficherToast('Lien copié ! 🔗'));
        } else {
            afficherToast('Lien copié ! 🔗');
        }
        fermerMenu();
    };

    function afficherToast(msg) {
        const t = document.createElement('div');
        t.innerText = msg;
        t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(255,204,0,0.95);color:#1a0b5a;padding:10px 20px;border-radius:25px;font-weight:bold;font-size:13px;z-index:9999;';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2200);
    }
</script>
</body>
</html>
