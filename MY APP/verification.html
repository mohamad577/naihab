<!DOCTYPE html>
<html lang="fr">
<head>
    <script type="module" src="firebase-config.js"></script>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naïhab - Vérification</title>
    <style>
        body {
            margin: 0; padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a0b5a;
            color: white; text-align: center;
            height: 100vh; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .icon-box {
            font-size: 60px; margin-bottom: 20px;
            background: rgba(255, 204, 0, 0.1);
            width: 100px; height: 100px;
            line-height: 100px; border-radius: 50%;
        }
        h2 { margin-bottom: 10px; font-size: 28px; font-weight: 800; }
        p { opacity: 0.8; font-size: 15px; margin-bottom: 30px; max-width: 300px; line-height: 1.5; }
        .code-inputs { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .code-inputs input {
            width: 45px; height: 60px; text-align: center;
            font-size: 24px; font-weight: bold; border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #ffcc00; outline: none; transition: 0.3s;
        }
        .code-inputs input:focus {
            border-color: #ffcc00; background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(255,204,0,0.2);
        }
        .btn-verify {
            width: 100%; max-width: 300px; padding: 18px;
            background: #ffcc00; color: #1a0b5a; border: none;
            border-radius: 30px; font-weight: bold; font-size: 16px;
            cursor: pointer; box-shadow: 0 5px 20px rgba(0,0,0,0.3); transition: 0.3s;
            position: relative; overflow: hidden;
        }
        .btn-verify:active { transform: scale(0.95); }
        .btn-verify.loading {
            background: rgba(255,204,0,0.3);
            color: transparent;
            pointer-events: none;
        }
        .btn-verify.loading::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 24px; height: 24px;
            margin: -12px 0 0 -12px;
            border: 3px solid rgba(255,204,0,0.3);
            border-top-color: #ffcc00;
            border-radius: 50%;
            animation: tourner 0.7s linear infinite;
        }
        @keyframes tourner {
            to { transform: rotate(360deg); }
        }
        .resend { margin-top: 25px; font-size: 13px; color: rgba(255,255,255,0.5); }
        .resend b { color: #ffcc00; cursor: pointer; }
    </style>
</head>
<body>

    <div class="icon-box">📩</div>
    <h2>Vérification</h2>
    <p>Entre le code de sécurité envoyé par SMS au <b id="numero-affiche"></b> pour protéger ton compte <b>Naïhab</b>.</p>

    <div class="code-inputs" id="otp-inputs">
        <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
        <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
        <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
        <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
        <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
        <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
    </div>

    <button class="btn-verify" onclick="verifierCode()">VÉRIFIER LE CODE</button>

    <p class="resend">Vous n'avez rien reçu ? <b id="resend-btn">Renvoyer (<span id="timer">00:59</span>)</b></p>

    <!-- Nécessaire pour le reCAPTCHA invisible en cas de renvoi de code -->
    <div id="recaptcha-container"></div>

    <script type="module">
        import {
            PhoneAuthProvider,
            linkWithCredential,
            RecaptchaVerifier,
            signInWithPhoneNumber
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { auth } from './firebase-config.js';

        const numeroAttendu = localStorage.getItem('naihab_phone_pending') || '';
        let verificationId = localStorage.getItem('naihab_verification_id');
        document.getElementById('numero-affiche').innerText = numeroAttendu;

        if (!verificationId) {
            // Aucune vérification en attente : on renvoie vers l'inscription
            window.location.href = 'inscription.html';
        }

        const inputs = document.querySelectorAll('#otp-inputs input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/[^0-9]/g, '').slice(-1);
                if (input.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        function traduireErreur(code) {
            switch (code) {
                case 'auth/invalid-verification-code':
                    return "Code incorrect ! Réessaie.";
                case 'auth/code-expired':
                    return "Ce code a expiré. Demande-en un nouveau.";
                case 'auth/network-request-failed':
                    return "Problème de connexion internet. Réessaie.";
                default:
                    return "Une erreur est survenue. Réessaie.";
            }
        }

        window.verifierCode = async function() {
            let codeSaisi = '';
            inputs.forEach(i => codeSaisi += i.value);

            if (codeSaisi.length < 6) {
                alert("Entre les 6 chiffres du code !");
                return;
            }

            const btn = document.querySelector('.btn-verify');
            btn.classList.add('loading');

            try {
                const credential = PhoneAuthProvider.credential(verificationId, codeSaisi);
                // On lie le numéro vérifié au compte déjà créé (email + mot de passe)
                await linkWithCredential(auth.currentUser, credential);

                localStorage.removeItem('naihab_verification_id');
                localStorage.removeItem('naihab_phone_pending');

                const pageAccueil = localStorage.getItem('naihab_page_accueil') || 'chats.html';
                window.location.href = pageAccueil;
            } catch (err) {
                btn.classList.remove('loading');
                alert(traduireErreur(err.code));
                inputs.forEach(i => i.value = '');
                inputs[0].focus();
            }
        };

        // Minuteur 59 secondes
        let secondes = 59;
        const timerEl = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');
        const interval = setInterval(() => {
            secondes--;
            timerEl.innerText = '00:' + (secondes < 10 ? '0' + secondes : secondes);
            if (secondes <= 0) {
                clearInterval(interval);
                resendBtn.innerHTML = '<b onclick="renvoyerCode()" style="cursor:pointer; color:#ffcc00;">Renvoyer le code</b>';
            }
        }, 1000);

        window.renvoyerCode = async function() {
            try {
                const recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                    size: 'invisible'
                });
                const confirmationResult = await signInWithPhoneNumber(auth, numeroAttendu, recaptchaVerifier);
                verificationId = confirmationResult.verificationId;
                localStorage.setItem('naihab_verification_id', verificationId);
                alert("Nouveau code envoyé par SMS !");
            } catch (err) {
                alert(traduireErreur(err.code));
            }
        };
    </script>

</body>
</html>
